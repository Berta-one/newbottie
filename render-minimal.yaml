services:
  - type: web
    name: bottie-minimal
    env: python
    region: oregon
    plan: free  # 512MB limit
    
    buildCommand: pip install --no-cache-dir -r requirements-minimal.txt
    startCommand: python minimal_dashboard.py
    
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONOPTIMIZE
        value: "2"
    
    healthCheckPath: /health