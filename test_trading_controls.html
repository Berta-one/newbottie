<!DOCTYPE html>
<html>
<head>
    <title>Test Trading Controls</title>
</head>
<body>
    <h1>Test Trading Controls</h1>
    <button onclick="testStart()">Test Start Trading</button>
    <button onclick="testStop()">Test Stop Trading</button>
    <div id="result"></div>

    <script>
        const API_BASE = 'https://bottie-1.onrender.com';

        async function testStart() {
            try {
                console.log('Testing POST to:', `${API_BASE}/trading/start`);
                
                const response = await fetch(`${API_BASE}/trading/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                const data = await response.json();
                document.getElementById('result').innerHTML = `Start: ${JSON.stringify(data)}`;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        }

        async function testStop() {
            try {
                console.log('Testing POST to:', `${API_BASE}/trading/stop`);
                
                const response = await fetch(`${API_BASE}/trading/stop`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                document.getElementById('result').innerHTML = `Stop: ${JSON.stringify(data)}`;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
