# Docs-only site: MkDocs course in chapters/ → output site/
[build]
  publish = "site"
  command = "pip install -r requirements-docs.txt && mkdocs build -f mkdocs-material.yml --strict"

[build.environment]
  PYTHON_VERSION = "3.12.4"
  # Netlify mise: python@3.12.4 often lacks GitHub attestations → install fails
  MISE_PYTHON_GITHUB_ATTESTATIONS = "0"
