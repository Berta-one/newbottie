<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottie Enhanced Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: #e6fffa;
            min-height: 100vh;
        }

        .header {
            background: rgba(26, 35, 50, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-indicators {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-online { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .status-offline { background: rgba(244, 67, 54, 0.2); color: #f44336; }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .slate {
            background: rgba(26, 35, 50, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(100, 255, 218, 0.1);
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .slate::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #64ffda, #4caf50);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .slate:hover::before {
            transform: scaleX(1);
        }

        .slate:hover {
            transform: translateY(-4px);
            border-color: rgba(100, 255, 218, 0.3);
            box-shadow: 0 8px 32px rgba(100, 255, 218, 0.1);
        }

        .slate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .slate-title {
            font-size: 1.125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .slate-icon {
            font-size: 1.5rem;
        }

        .slate-status {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-excellent { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .status-good { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .status-warning { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .status-error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .status-loading { background: rgba(156, 39, 176, 0.2); color: #9c27b0; }

        .slate-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .metric {
            text-align: center;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .metric-label {
            font-size: 0.75rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .slate-description {
            color: #8892b0;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .report-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .report-content {
            background: linear-gradient(135deg, #1a2332 0%, #2d3748 100%);
            border-radius: 16px;
            border: 1px solid rgba(100, 255, 218, 0.2);
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .report-header {
            padding: 2rem;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .report-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: #8892b0;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
        }

        .report-body {
            padding: 2rem;
        }

        .report-section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #64ffda;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .data-card {
            background: rgba(15, 20, 25, 0.5);
            border: 1px solid rgba(100, 255, 218, 0.1);
            border-radius: 8px;
            padding: 1rem;
        }

        .data-label {
            font-size: 0.875rem;
            color: #8892b0;
            margin-bottom: 0.5rem;
        }

        .data-value {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .logs-container {
            background: rgba(15, 20, 25, 0.8);
            border: 1px solid rgba(100, 255, 218, 0.1);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.25rem 0;
        }

        .log-timestamp {
            color: #64ffda;
            margin-right: 0.5rem;
        }

        .log-level-info { color: #4caf50; }
        .log-level-warn { color: #ff9800; }
        .log-level-error { color: #f44336; }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(100, 255, 218, 0.3);
            border-radius: 50%;
            border-top-color: #64ffda;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .chart-container {
            background: rgba(15, 20, 25, 0.5);
            border: 1px solid rgba(100, 255, 218, 0.1);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
        }

        .export-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .export-btn {
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.3);
            color: #64ffda;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: rgba(100, 255, 218, 0.2);
            transform: translateY(-1px);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .feature-card {
            background: rgba(15, 20, 25, 0.5);
            border: 1px solid rgba(100, 255, 218, 0.1);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .feature-importance {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .feature-name {
            font-size: 0.875rem;
            color: #8892b0;
        }

        .positive { color: #4caf50; }
        .negative { color: #f44336; }
        .neutral { color: #64ffda; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⚡ Bottie Enhanced Dashboard v2.0 🚀 [DEPLOYED]</div>
        <div class="status-indicators">
            <div class="status-badge status-online">
                <span>🟢</span>
                <span>System Online</span>
            </div>
            <div class="status-badge" id="connection-status">
                <span class="loading-spinner"></span>
                <span>Connecting...</span>
            </div>
            <div class="status-badge status-online">
                <span>🕒</span>
                <span>Updated: ${new Date().toLocaleTimeString()}</span>
            </div>
        </div>
    </div>

    <div class="main-grid" id="slates-container">
        <!-- Slates will be dynamically generated here -->
    </div>

    <!-- Report Modal -->
    <div class="report-modal" id="report-modal">
        <div class="report-content">
            <div class="report-header">
                <div class="report-title" id="report-title">
                    <span id="report-icon">📊</span>
                    <span id="report-name">Loading Report...</span>
                </div>
                <button class="close-btn" onclick="closeReport()">✕</button>
            </div>
            <div class="report-body" id="report-body">
                <div style="text-align: center; padding: 2rem;">
                    <div class="loading-spinner" style="width: 40px; height: 40px;"></div>
                    <p style="margin-top: 1rem; color: #8892b0;">Generating report...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class EnhancedDashboard {
            constructor() {
                this.apiUrl = 'https://bottie-1.onrender.com';
                this.endpoints = [
                    { name: 'equity', title: 'Portfolio Equity', icon: '💰', endpoint: '/status' },
                    { name: 'trades', title: 'Trade History', icon: '📈', endpoint: '/trades' },
                    { name: 'ml', title: 'ML Performance', icon: '🧠', endpoint: '/ml/status' },
                    { name: 'quantum', title: 'Quantum Analysis', icon: '⚛️', endpoint: '/quantum/analysis' },
                    { name: 'sentiment', title: 'Sentiment Analysis', icon: '📰', endpoint: '/sentiment' },
                    { name: 'signals', title: 'Trading Signals', icon: '🎯', endpoint: '/signals' },
                    { name: 'positions', title: 'Current Positions', icon: '💼', endpoint: '/positions' },
                    { name: 'health', title: 'System Health', icon: '🔋', endpoint: '/health' },
                    { name: 'reports', title: 'Daily Reports', icon: '📊', endpoint: '/reports/daily' },
                    { name: 'api', title: 'API Status', icon: '🌐', endpoint: '/api-info' }
                ];
                this.endpointData = {};
                this.init();
            }

            async init() {
                console.log('🚀 Initializing Enhanced Dashboard...');
                await this.loadAllEndpoints();
                this.renderSlates();
                this.updateConnectionStatus();
                
                setInterval(() => {
                    this.loadAllEndpoints();
                    this.updateSlateMetrics();
                }, 30000);
            }

            async loadAllEndpoints() {
                const promises = this.endpoints.map(endpoint => this.loadEndpoint(endpoint));
                await Promise.allSettled(promises);
            }

            async loadEndpoint(endpoint) {
                try {
                    const response = await fetch(`${this.apiUrl}${endpoint.endpoint}`);
                    const data = await response.json();
                    this.endpointData[endpoint.name] = {
                        ...data,
                        status: response.ok ? 'success' : 'error',
                        lastUpdate: new Date().toISOString()
                    };
                    console.log(`✅ Loaded ${endpoint.name}:`, data);
                } catch (error) {
                    this.endpointData[endpoint.name] = {
                        status: 'error',
                        error: error.message,
                        lastUpdate: new Date().toISOString()
                    };
                    console.log(`❌ Error loading ${endpoint.name}:`, error);
                }
            }

            renderSlates() {
                const container = document.getElementById('slates-container');
                if (!container) {
                    console.error('❌ Slates container not found');
                    return;
                }
                container.innerHTML = this.endpoints.map(endpoint => this.createSlate(endpoint)).join('');
                console.log('✅ Slates rendered');
            }

            createSlate(endpoint) {
                const data = this.endpointData[endpoint.name] || {};
                const metrics = this.getEndpointMetrics(endpoint.name, data);
                const status = this.getEndpointStatus(data);

                return `
                    <div class="slate" onclick="dashboard.generateReport('${endpoint.name}')">
                        <div class="slate-header">
                            <div class="slate-title">
                                <span class="slate-icon">${endpoint.icon}</span>
                                ${endpoint.title}
                            </div>
                            <div class="slate-status ${status.class}">${status.text}</div>
                        </div>
                        <div class="slate-metrics">
                            ${metrics.map(metric => `
                                <div class="metric">
                                    <div class="metric-value ${metric.class || ''}">${metric.value}</div>
                                    <div class="metric-label">${metric.label}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="slate-description">
                            ${this.getEndpointDescription(endpoint.name, data)}
                        </div>
                    </div>
                `;
            }

            getEndpointMetrics(name, data) {
                switch (name) {
                    case 'equity':
                        const equityValue = data.equity?.display_value || data.equity || 0;
                        const numericEquity = typeof equityValue === 'number' ? equityValue : parseFloat(equityValue) || 0;
                        return [
                            { label: 'Current Equity', value: `$${numericEquity.toFixed(2)}`, class: numericEquity > 0 ? 'positive' : 'neutral' },
                            { label: 'Positions', value: Object.keys(data.positions || {}).length }
                        ];
                    case 'trades':
                        const trades = data.trades || [];
                        return [
                            { label: 'Total Trades', value: trades.length },
                            { label: 'Status', value: data.status === 'success' ? 'Active' : 'Error', class: data.status === 'success' ? 'positive' : 'negative' }
                        ];
                    case 'health':
                        const healthEquity = data.equity?.display_value || data.equity || 0;
                        const healthEquityNum = typeof healthEquity === 'number' ? healthEquity : parseFloat(healthEquity) || 0;
                        return [
                            { label: 'Status', value: data.ok ? 'Healthy' : 'Issues', class: data.ok ? 'positive' : 'negative' },
                            { label: 'Equity', value: healthEquityNum > 0 ? `$${healthEquityNum.toFixed(2)}` : 'N/A' }
                        ];
                    default:
                        return [
                            { label: 'Status', value: data.status === 'success' ? 'OK' : 'Error', class: data.status === 'success' ? 'positive' : 'negative' },
                            { label: 'Last Update', value: data.lastUpdate ? new Date(data.lastUpdate).toLocaleTimeString() : 'Never' }
                        ];
                }
            }

            getEndpointStatus(data) {
                if (data.status === 'error') {
                    return { class: 'status-error', text: 'Error' };
                }
                
                switch (data.status) {
                    case 'success':
                        return { class: 'status-excellent', text: 'Active' };
                    default:
                        return { class: 'status-loading', text: 'Loading' };
                }
            }

            getEndpointDescription(name, data) {
                const descriptions = {
                    equity: `Monitor your portfolio value and asset allocation across all trading pairs.`,
                    trades: `Complete history of executed trades with P&L calculations and performance metrics.`,
                    ml: `Machine learning model performance, accuracy metrics, and prediction confidence scores.`,
                    quantum: `Quantum-inspired algorithmic analysis and portfolio optimization insights.`,
                    sentiment: `Real-time market sentiment analysis from news sources and social media.`,
                    signals: `Live trading signals with confidence levels and recommended actions.`,
                    positions: `Current open positions, unrealized P&L, and risk exposure analysis.`,
                    health: `Overall system health monitoring and component status checks.`,
                    reports: `Daily trading reports and performance summaries.`,
                    api: `API status and system information.`
                };
                
                return descriptions[name] || 'Comprehensive data analysis and reporting for this component.';
            }

            async generateReport(endpointName) {
                const endpoint = this.endpoints.find(e => e.name === endpointName);
                if (!endpoint) return;

                const modal = document.getElementById('report-modal');
                const icon = document.getElementById('report-icon');
                const name = document.getElementById('report-name');
                const body = document.getElementById('report-body');

                icon.textContent = endpoint.icon;
                name.textContent = `${endpoint.title} Report`;
                modal.style.display = 'flex';

                body.innerHTML = `
                    <div style="text-align: center; padding: 2rem;">
                        <div class="loading-spinner" style="width: 40px; height: 40px;"></div>
                        <p style="margin-top: 1rem; color: #8892b0;">Generating comprehensive report...</p>
                    </div>
                `;

                setTimeout(() => {
                    const data = this.endpointData[endpointName] || {};
                    body.innerHTML = `
                        <div style="padding: 1rem;">
                            <h3>📊 ${endpoint.title} Details</h3>
                            <div style="background: rgba(15, 20, 25, 0.8); border: 1px solid rgba(100, 255, 218, 0.1); border-radius: 8px; padding: 1rem; margin: 1rem 0; font-family: 'Fira Code', monospace; font-size: 0.875rem; max-height: 400px; overflow-y: auto;">
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                            <div style="margin-top: 1rem;">
                                <button onclick="dashboard.exportData('${endpointName}')" style="background: rgba(100, 255, 218, 0.1); border: 1px solid rgba(100, 255, 218, 0.3); color: #64ffda; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; margin-right: 0.5rem;">💾 Export JSON</button>
                                <button onclick="closeReport()" style="background: rgba(244, 67, 54, 0.1); border: 1px solid rgba(244, 67, 54, 0.3); color: #f44336; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">✕ Close</button>
                            </div>
                        </div>
                    `;
                }, 1500);
            }

            exportData(endpointName) {
                const data = this.endpointData[endpointName] || {};
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                const filename = `${endpointName}_report_${timestamp}.json`;
                
                const content = JSON.stringify(data, null, 2);
                const blob = new Blob([content], { type: 'application/json' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }

            updateConnectionStatus() {
                const statusEl = document.getElementById('connection-status');
                if (!statusEl) return;
                
                const hasErrors = Object.values(this.endpointData).some(data => data.status === 'error');
                
                if (hasErrors) {
                    statusEl.innerHTML = '<span>🟡</span><span>Partial Connection</span>';
                    statusEl.className = 'status-badge status-warning';
                } else {
                    statusEl.innerHTML = '<span>🟢</span><span>All Systems Online</span>';
                    statusEl.className = 'status-badge status-online';
                }
            }

            updateSlateMetrics() {
                this.renderSlates();
            }
        }

        function closeReport() {
            const modal = document.getElementById('report-modal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        // Initialize dashboard when page loads
        let dashboard;
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎯 DOM Content Loaded - Starting Dashboard');
            dashboard = new EnhancedDashboard();
        });

        // Close modal when clicking outside
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('report-modal');
            if (modal && e.target === modal) {
                closeReport();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeReport();
            }
        });
    </script>
</body>
</html>
