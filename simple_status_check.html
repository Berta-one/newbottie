<!DOCTYPE html>
<html>
<head>
    <title>Bot Status Check</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #2d5a2d; }
        .error { background: #5a2d2d; }
        .warning { background: #5a5a2d; }
        pre { background: #333; padding: 10px; border-radius: 5px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🤖 Bot Status Check</h1>
    <div id="status">Loading...</div>
    
    <script>
        // Replace with your actual Render URL
        const BOT_URL = 'https://your-app.onrender.com';
        
        async function checkBotStatus() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="warning">Checking bot status...</div>';
            
            const endpoints = [
                { url: '/health', name: 'Health Check' },
                { url: '/status', name: 'Bot Status' },
                { url: '/trading/status', name: 'Trading Status' },
                { url: '/positions', name: 'Positions' },
                { url: '/signals', name: 'Signals' }
            ];
            
            let html = '<h2>Bot Status Results:</h2>';
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(BOT_URL + endpoint.url);
                    if (response.ok) {
                        const data = await response.json();
                        html += `<div class="status success">
                            <h3>✅ ${endpoint.name}</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>`;
                    } else {
                        html += `<div class="status error">
                            <h3>❌ ${endpoint.name}</h3>
                            <p>HTTP ${response.status}: ${response.statusText}</p>
                        </div>`;
                    }
                } catch (error) {
                    html += `<div class="status error">
                        <h3>❌ ${endpoint.name}</h3>
                        <p>Error: ${error.message}</p>
                    </div>`;
                }
            }
            
            statusDiv.innerHTML = html;
        }
        
        // Check status when page loads
        checkBotStatus();
        
        // Auto-refresh every 30 seconds
        setInterval(checkBotStatus, 30000);
    </script>
    
    <p><strong>Instructions:</strong></p>
    <ol>
        <li>Replace <code>BOT_URL</code> in the script with your actual Render URL</li>
        <li>Upload this file to your Render service</li>
        <li>Visit it to see your bot's real status without dashboard errors</li>
    </ol>
</body>
</html>
