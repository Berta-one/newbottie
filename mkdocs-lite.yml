# Minimal MkDocs config — works with: pip install mkdocs && mkdocs build -f mkdocs-lite.yml
# Use mkdocs.yml + requirements-docs.txt for Material theme (chapters.berta.one–style UI).
site_name: Bottie — Build the Trading Stack
site_description: Chapter-based Bottie guide
docs_dir: chapters

theme:
  name: readthedocs

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Chapter 0 — New to Python & APIs: chapter-00-beginners-apis-and-keys/README.md
  - Curriculum: CURRICULUM.md
  - Getting started: GETTING_STARTED.md
  - "Tool as-is — when APIs change": ADAPTING_WHEN_THINGS_CHANGE.md
  - Note for creators (pricing): NOTE_FOR_CREATORS.md
  - Chapter 1 — Overview: chapter-01-overview/README.md
  - Chapter 2 — Environment: chapter-02-environment/README.md
  - Chapter 3 — API & services: chapter-03-api/README.md
  - Chapter 4 — Engine & execution: chapter-04-engine/README.md
  - Chapter 5 — ML & signals: chapter-05-ml/README.md
  - Chapter 6 — Quantum & sentiment: chapter-06-quantum-sentiment/README.md
  - Chapter 7 — Hardening & ops: chapter-07-hardening/README.md
