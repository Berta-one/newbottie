<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dashboard - Sntax</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a2332;
            color: #e6fffa;
            padding: 2rem;
        }
        .debug-section {
            background: rgba(26, 35, 50, 0.8);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
        }
        .error { color: #f44336; }
        .success { color: #4caf50; }
        .warning { color: #ffa726; }
        button {
            background: #64ffda;
            color: #0f1419;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin: 0.5rem;
        }
        pre {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 4px;
            overflow: auto;
            max-height: 300px;
        }
    </style>
</head>
<body>
    <h1>🔧 Sntax Debug Dashboard</h1>
    <p>This page helps identify JavaScript and API issues</p>

    <div class="debug-section">
        <h3>🌐 API Connection Tests</h3>
        <button onclick="testHealthEndpoint()">Test Health</button>
        <button onclick="testMLEndpoint()">Test ML Status</button>
        <button onclick="testSignalsEndpoint()">Test Signals</button>
        <button onclick="testAllEndpoints()">Test All Endpoints</button>
        <div id="apiResults"></div>
    </div>

    <div class="debug-section">
        <h3>📱 JavaScript Environment</h3>
        <div id="jsEnvironment"></div>
    </div>

    <div class="debug-section">
        <h3>🔍 Error Log</h3>
        <button onclick="clearErrorLog()">Clear Log</button>
        <div id="errorLog"></div>
    </div>

    <div class="debug-section">
        <h3>🧪 WebSocket Test</h3>
        <button onclick="testWebSocket()">Test WebSocket Connection</button>
        <div id="wsResults"></div>
    </div>

    <script>
        // Error logging
        const errorLog = [];
        
        function logError(error, context = '') {
            const timestamp = new Date().toLocaleTimeString();
            const errorInfo = {
                timestamp,
                context,
                error: error.toString(),
                stack: error.stack
            };
            errorLog.push(errorInfo);
            updateErrorLog();
            console.error(`[${timestamp}] ${context}:`, error);
        }
        
        function updateErrorLog() {
            const logDiv = document.getElementById('errorLog');
            if (errorLog.length === 0) {
                logDiv.innerHTML = '<p class="success">No errors logged</p>';
                return;
            }
            
            let html = '';
            errorLog.slice(-10).forEach(log => {
                html += `
                    <div style="margin: 0.5rem 0; padding: 0.5rem; background: rgba(244, 67, 54, 0.1); border-radius: 4px;">
                        <strong>${log.timestamp}</strong> - ${log.context}<br>
                        <span class="error">${log.error}</span>
                        ${log.stack ? `<pre>${log.stack}</pre>` : ''}
                    </div>
                `;
            });
            logDiv.innerHTML = html;
        }
        
        function clearErrorLog() {
            errorLog.length = 0;
            updateErrorLog();
        }
        
        // Override console.error to catch all errors
        const originalConsoleError = console.error;
        console.error = function(...args) {
            logError(new Error(args.join(' ')), 'Console Error');
            originalConsoleError.apply(console, args);
        };
        
        // Catch unhandled errors
        window.addEventListener('error', function(event) {
            logError(event.error || new Error(event.message), `Script Error in ${event.filename}:${event.lineno}`);
        });
        
        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
            logError(new Error(event.reason), 'Unhandled Promise Rejection');
        });
        
        // API Testing Functions
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://127.0.0.1:8000' 
            : 'https://bottie-1.onrender.com';
        
        async function testEndpoint(endpoint, name) {
            const resultsDiv = document.getElementById('apiResults');
            const startTime = Date.now();
            
            try {
                resultsDiv.innerHTML += `<p>🔄 Testing ${name} (${endpoint})...</p>`;
                
                const response = await fetch(`${API_BASE}${endpoint}`);
                const responseTime = Date.now() - startTime;
                
                console.log(`Response for ${endpoint}:`, response);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const contentType = response.headers.get('content-type');
                console.log(`Content-Type for ${endpoint}:`, contentType);
                
                let data;
                if (contentType && contentType.includes('application/json')) {
                    const textData = await response.text();
                    console.log(`Raw response for ${endpoint}:`, textData.substring(0, 200));
                    
                    try {
                        data = JSON.parse(textData);
                    } catch (parseError) {
                        throw new Error(`JSON Parse Error: ${parseError.message}. Response: ${textData.substring(0, 100)}`);
                    }
                } else {
                    const textData = await response.text();
                    throw new Error(`Expected JSON but got ${contentType}. Response: ${textData.substring(0, 100)}`);
                }
                
                resultsDiv.innerHTML += `
                    <p class="success">✅ ${name}: ${response.status} (${responseTime}ms)</p>
                    <pre>${JSON.stringify(data, null, 2).substring(0, 300)}${JSON.stringify(data, null, 2).length > 300 ? '...' : ''}</pre>
                `;
                
            } catch (error) {
                logError(error, `API Test: ${name}`);
                resultsDiv.innerHTML += `<p class="error">❌ ${name}: ${error.message}</p>`;
            }
        }
        
        async function testHealthEndpoint() {
            await testEndpoint('/health', 'Health Check');
        }
        
        async function testMLEndpoint() {
            await testEndpoint('/ml/status', 'ML Status');
        }
        
        async function testSignalsEndpoint() {
            await testEndpoint('/signals', 'Trading Signals');
        }
        
        async function testAllEndpoints() {
            const endpoints = [
                { endpoint: '/health', name: 'Health' },
                { endpoint: '/status', name: 'Status' },
                { endpoint: '/ml/status', name: 'ML Status' },
                { endpoint: '/signals', name: 'Signals' },
                { endpoint: '/positions', name: 'Positions' },
                { endpoint: '/trades/recent', name: 'Recent Trades' },
                { endpoint: '/logs', name: 'Logs' }
            ];
            
            document.getElementById('apiResults').innerHTML = '<h4>🧪 Testing All Endpoints:</h4>';
            
            for (const { endpoint, name } of endpoints) {
                await testEndpoint(endpoint, name);
                await new Promise(resolve => setTimeout(resolve, 500)); // Small delay between tests
            }
        }
        
        // WebSocket Testing
        function testWebSocket() {
            const resultsDiv = document.getElementById('wsResults');
            resultsDiv.innerHTML = '<p>🔄 Testing WebSocket connection...</p>';
            
            try {
                const ws = new WebSocket('ws://localhost:8765');
                
                ws.onopen = function() {
                    resultsDiv.innerHTML += '<p class="success">✅ WebSocket connected</p>';
                    
                    // Test sending a message
                    const testMessage = { type: 'get_pnl_report' };
                    ws.send(JSON.stringify(testMessage));
                    resultsDiv.innerHTML += '<p>📤 Sent test message</p>';
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        resultsDiv.innerHTML += `
                            <p class="success">📥 Received message: ${data.type}</p>
                            <pre>${JSON.stringify(data, null, 2).substring(0, 500)}</pre>
                        `;
                    } catch (error) {
                        logError(error, 'WebSocket Message Parse');
                        resultsDiv.innerHTML += `<p class="error">❌ Failed to parse WebSocket message: ${error.message}</p>`;
                    }
                };
                
                ws.onerror = function(error) {
                    logError(new Error('WebSocket error'), 'WebSocket Connection');
                    resultsDiv.innerHTML += '<p class="error">❌ WebSocket error</p>';
                };
                
                ws.onclose = function() {
                    resultsDiv.innerHTML += '<p class="warning">🔌 WebSocket connection closed</p>';
                };
                
                // Close connection after 5 seconds
                setTimeout(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.close();
                    }
                }, 5000);
                
            } catch (error) {
                logError(error, 'WebSocket Test');
                resultsDiv.innerHTML += `<p class="error">❌ WebSocket test failed: ${error.message}</p>`;
            }
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔧 Debug dashboard loaded');
            
            // Display JavaScript environment info
            const jsDiv = document.getElementById('jsEnvironment');
            jsDiv.innerHTML = `
                <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
                <p><strong>API Base URL:</strong> ${API_BASE}</p>
                <p><strong>WebSocket Support:</strong> ${typeof WebSocket !== 'undefined' ? '✅ Yes' : '❌ No'}</p>
                <p><strong>Fetch Support:</strong> ${typeof fetch !== 'undefined' ? '✅ Yes' : '❌ No'}</p>
                <p><strong>JSON Support:</strong> ${typeof JSON !== 'undefined' ? '✅ Yes' : '❌ No'}</p>
                <p><strong>Current Time:</strong> ${new Date().toLocaleString()}</p>
            `;
            
            // Initialize error log
            updateErrorLog();
            
            // Auto-test health endpoint
            setTimeout(testHealthEndpoint, 1000);
        });
    </script>
</body>
</html>
