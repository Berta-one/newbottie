<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard - CACHE BYPASS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-chart-line text-2xl"></i>
                    <h1 class="text-2xl font-bold">Trading Dashboard - CACHE BYPASS VERSION</h1>
                </div>
                <button onclick="loadReports()" class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-lg">
                    <i class="fas fa-sync-alt mr-2"></i>Refresh
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <!-- Status Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-lg font-semibold mb-4">API Status</h3>
                <div id="apiStatus">Testing...</div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-lg font-semibold mb-4">Trading Data</h3>
                <div id="tradingData">Loading...</div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-lg font-semibold mb-4">ML Data</h3>
                <div id="mlData">Loading...</div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-lg font-semibold mb-4">Proxy Test</h3>
                <div id="proxyTest">Testing...</div>
            </div>
        </div>
        
        <!-- Reports Grid -->
        <div id="reportsContainer" class="report-grid mb-8">
            <!-- Reports will be loaded here -->
        </div>
        
        <!-- Debug Console -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-lg font-semibold mb-4">Debug Console</h3>
            <div id="debugOutput" class="bg-gray-100 p-4 rounded font-mono text-sm max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // INLINE JAVASCRIPT - ABSOLUTELY NO CACHE POSSIBLE
        console.log('🚀 CACHE BYPASS VERSION LOADED');
        
        const VERSION = 'v2024-01-17-CACHE-BYPASS-FINAL';
        const API_URL = '';  // Use direct paths on Render (no proxy)
        
        let reports = [];
        
        function log(message) {
            console.log(message);
            const output = document.getElementById('debugOutput');
            output.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
            output.scrollTop = output.scrollHeight;
        }
        
        async function testEndpoint(endpoint, description, useProxy = true) {
            // Since we're on Render directly, both URLs are the same
            const url = `${API_URL}${endpoint}`;
            log(`🔍 Testing ${description}: ${url}`);
            
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                log(`📊 ${description} Response: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ ${description} SUCCESS - Data received`);
                    return { success: true, data: data };
                } else {
                    log(`❌ ${description} FAILED: ${response.status}`);
                    return { success: false, error: `HTTP ${response.status}` };
                }
            } catch (error) {
                log(`💥 ${description} ERROR: ${error.message}`);
                return { success: false, error: error.message };
            }
        }
        
        async function loadReports() {
            log(`🌟 Starting Dashboard ${VERSION}`);
            log(`📡 API URL: ${API_URL}`);
            log(`🌐 Hostname: ${window.location.hostname}`);
            
            // Test API status
            const health = await testEndpoint('/health', 'Health Check (via proxy)', true);
            document.getElementById('apiStatus').innerHTML = health.success 
                ? '<span class="text-green-600">✅ API Online</span>'
                : '<span class="text-red-600">❌ API Offline</span>';
            
            // Test trading data via proxy
            const trades = await testEndpoint('/trades', 'Trading Data (via proxy)', true);
            if (trades.success && trades.data.trades) {
                const tradesCount = trades.data.trades.length;
                const totalPnL = trades.data.summary?.net_pnl || 0;
                document.getElementById('tradingData').innerHTML = `
                    <div class="space-y-2">
                        <div>Trades: <span class="font-bold">${tradesCount}</span></div>
                        <div>P&L: <span class="font-bold ${totalPnL >= 0 ? 'text-green-600' : 'text-red-600'}">$${totalPnL.toFixed(2)}</span></div>
                    </div>
                `;
                log(`📈 Trading via proxy: ${tradesCount} trades, P&L: $${totalPnL.toFixed(2)}`);
                
                // Create trading report
                reports.push({
                    id: 'trading_' + Date.now(),
                    type: 'trading',
                    title: 'Trading Performance Report',
                    summary: {
                        totalTrades: tradesCount,
                        totalProfit: totalPnL,
                        winRate: calculateWinRate(trades.data.trades)
                    },
                    data: trades.data.trades
                });
            } else {
                document.getElementById('tradingData').innerHTML = '<span class="text-red-600">❌ No Data</span>';
            }
            
            // Test ML data via proxy
            const ml = await testEndpoint('/ml/status', 'ML Status (via proxy)', true);
            if (ml.success && ml.data) {
                // Check if accuracy is already a percentage or decimal
                const accuracyValue = ml.data.accuracy > 1 ? ml.data.accuracy : ml.data.accuracy * 100;
                const accuracy = accuracyValue.toFixed(1);
                const predictions = ml.data.total_predictions || 0;
                document.getElementById('mlData').innerHTML = `
                    <div class="space-y-2">
                        <div>Accuracy: <span class="font-bold text-green-600">${accuracy}%</span></div>
                        <div>Predictions: <span class="font-bold">${predictions}</span></div>
                    </div>
                `;
                log(`🧠 ML via proxy: ${accuracy}% accuracy, ${predictions} predictions`);
                
                // Create ML report
                reports.push({
                    id: 'ml_' + Date.now(),
                    type: 'ml',
                    title: 'ML Performance Analysis',
                    summary: {
                        accuracy: ml.data.accuracy,
                        confidence: ml.data.confidence || 0,
                        totalPredictions: predictions
                    },
                    data: ml.data
                });
            } else {
                document.getElementById('mlData').innerHTML = '<span class="text-red-600">❌ No Data</span>';
            }
            
            // Test proxy vs direct
            const directTest = await testEndpoint('/trades', 'Direct Call (bypass proxy)', false);
            const proxyTest = await testEndpoint('/trades', 'Proxy Call', true);
            
            document.getElementById('proxyTest').innerHTML = `
                <div class="space-y-1 text-sm">
                    <div>Direct: <span class="${directTest.success ? 'text-green-600' : 'text-red-600'}">${directTest.success ? '✅' : '❌'}</span></div>
                    <div>Proxy: <span class="${proxyTest.success ? 'text-green-600' : 'text-red-600'}">${proxyTest.success ? '✅' : '❌'}</span></div>
                </div>
            `;
            
            // Render reports
            renderReports();
            log('✅ All tests completed!');
        }
        
        function calculateWinRate(trades) {
            if (!trades || trades.length === 0) return 0;
            const wins = trades.filter(t => (t.profit || t.pnl || 0) > 0).length;
            return (wins / trades.length) * 100;
        }
        
        function renderReports() {
            const container = document.getElementById('reportsContainer');
            if (reports.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-500">No reports available</div>';
                return;
            }
            
            container.innerHTML = reports.map(report => createReportCard(report)).join('');
        }
        
        function createReportCard(report) {
            const typeIcon = report.type === 'trading' ? 'fa-chart-line' : 'fa-brain';
            const createdAt = new Date().toLocaleDateString();
            
            return `
                <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center space-x-2">
                            <i class="fas ${typeIcon} text-blue-600"></i>
                            <span class="text-sm font-medium text-gray-600 uppercase">${report.type}</span>
                        </div>
                        <span class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            completed
                        </span>
                    </div>
                    
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">${report.title}</h3>
                    <p class="text-gray-600 text-sm mb-4">Created: ${createdAt}</p>
                    
                    <div class="space-y-2">
                        ${createSummaryItems(report)}
                    </div>
                </div>
            `;
        }
        
        function createSummaryItems(report) {
            if (report.type === 'trading') {
                const s = report.summary;
                return `
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Total Trades:</span>
                        <span class="font-medium">${s.totalTrades || 0}</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Win Rate:</span>
                        <span class="font-medium">${(s.winRate || 0).toFixed(1)}%</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Total P&L:</span>
                        <span class="font-medium ${(s.totalProfit || 0) >= 0 ? 'text-green-600' : 'text-red-600'}">
                            $${(s.totalProfit || 0).toFixed(2)}
                        </span>
                    </div>
                `;
            } else if (report.type === 'ml') {
                const s = report.summary;
                return `
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Accuracy:</span>
                        <span class="font-medium">${(s.accuracy > 1 ? s.accuracy : s.accuracy * 100).toFixed(1)}%</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Confidence:</span>
                        <span class="font-medium">${((s.confidence || 0) * 100).toFixed(1)}%</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Predictions:</span>
                        <span class="font-medium">${s.totalPredictions || 0}</span>
                    </div>
                `;
            }
            return '';
        }
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', () => {
            log('🌟 Cache Bypass Dashboard loaded');
            loadReports();
        });
    </script>
</body>
</html>
