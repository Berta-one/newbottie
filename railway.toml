[build]
builder = "NIXPACKS"

[deploy]
startCommand = "streamlit run hybrid_bot.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableWebsocketCompression=true"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300