# railway.toml - Railway deployment configuration
[build]
builder = "nixpacks"
watchPatterns = ["**/*.py", "requirements.txt", ".env.example"]

[deploy]
startCommand = "streamlit run hybrid_bot.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false --server.enableWebsocketCompression=false"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environment]
# Core settings
BOT_MODE = "hybrid"
RAILWAY_ENVIRONMENT = "production"
PORT = "8080"

# Streamlit WebSocket settings
STREAMLIT_SERVER_ENABLE_CORS = "false"
STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION = "false"
STREAMLIT_SERVER_ENABLE_WEBSOCKET_COMPRESSION = "false"
STREAMLIT_SERVER_MAX_UPLOAD_SIZE = "200"
STREAMLIT_SERVER_MAX_MESSAGE_SIZE = "200"

# Bot configuration
MIN_BALANCE_USD = "10.0"
SCAN_INTERVAL = "300"
MIN_CONFIDENCE = "0.65"
RISK_PERCENTAGE = "0.015"
MAX_POSITIONS = "3"
USE_TESTNET = "true"
QUANTUM_ENABLED = "true"
ML_ENABLED = "true"
LOG_LEVEL = "INFO"

# Trading pairs (Railway-friendly format)
TRADING_PAIRS = "BTCUSDT,ETHUSDT,BNBUSDT,XRPUSDT,ADAUSDT,SOLUSDT,DOTUSDT,LINKUSDT,LTCUSDT,BCHUSDT"

# Strategy weights
QUANTUM_WEIGHT = "0.3"
TECHNICAL_WEIGHT = "0.4"
ML_WEIGHT = "0.3"

[volumes]
logs = "/app/logs"
