[build]
builder = "nixpacks"

[deploy]
# Run both dashboard AND background bot simultaneously
startCommand = "python background_bot.py & streamlit run dashboard.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false"

[environment]
MAIN_DASHBOARD = "dashboard.py"
BOT_MODE = "dual"