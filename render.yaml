services:
  - type: web
    name: bottie-trading-system
    env: python
    region: oregon
    plan: free  # 512MB memory limit
    
    # Build process with minimal dependencies
    buildCommand: |
      pip install --no-cache-dir -r requirements-deploy.txt
      python -c "import gc; gc.collect()"
    
    startCommand: python3 bulletproof.py
    
    # Environment variables for deployment
    envVars:
      # Core settings
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: DEMO_MODE
        value: "1"  # Safe demo mode for deployment
      - key: PYTHONUNBUFFERED
        value: "1"
      
      # Trading settings
      - key: TRADE_ENABLED
        value: "1"
      - key: EXECUTION_INTERVAL_S
        value: "30"
      - key: TRADE_QUOTE_PER_ORDER
        value: "50"
      
      # Dashboard
      - key: DASHBOARD_PASSWORD
        value: "bottie2024"
      
      # Logging
      - key: LOG_LEVEL
        value: "INFO"

    # Health check configuration
    healthCheckPath: /health
    
    # Auto-deploy settings
    autoDeploy: true