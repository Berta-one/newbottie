services:
  - type: web
    name: bottie-api
    runtime: python
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: |
      python -m pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
      echo "Installing Node.js dependencies for frontend..."
      npm install
      echo "Building enhanced dashboard..."
      npm run build
      echo "Copying enhanced dashboard to root for serving..."
      cp index.html ./
      cp style.css ./
      echo "Build completed for render_api deployment with enhanced dashboard"
    startCommand: uvicorn render_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: "production"
      - key: TRADE_ENABLED
        value: "1"
      - key: LIVE_TRADING_ENABLED
        value: "true"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "Diego1234!"
      - key: SUPERUSER_PASSWORD
        value: "SuperUser2024!"
      - key: JWT_SECRET_KEY
        value: "bottie-render-secret-key-2024"
      - key: NETLIFY_URL
        value: "*"
