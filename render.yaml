# render.yaml
services:
  - type: worker
    name: bottie-bot
    runtime: python
    plan: starter           # use "starter" ($7/mo) for 24/7; "free" sleeps -> not good for a bot
    region: oregon          # pick closest: oregon, frankfurt, singapore, etc.
    autoDeploy: true
    buildCommand: |
      python -m pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
    startCommand: python headless_bot.py
    envVars:
      # --- runtime knobs (safe defaults) ---
      - key: BOT_MODE
        value: paper          # change to "live" when you're ready
      - key: EQUITY_START
        value: "10000"
      - key: MIN_TRADE_CONF
        value: "0.15"
      - key: TRADE_COOLDOWN_S
        value: "30"
      - key: MAX_POS_PCT
        value: "0.5"
      - key: SYMBOLS
        value: BTC/USDT,ETH/USDT
      - key: LOG_LEVEL
        value: INFO

      # --- secrets (set values in Render UI; do NOT commit real keys) ---
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false

      # Optional quantum (only if you actually use it now)
      - key: QISKIT_RUNTIME_TOKEN
        sync: false

