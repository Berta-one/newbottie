services:
  - type: web
    name: bottie-api
    runtime: python
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: |
      python -m pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn diagnostic_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: "production"
      - key: TRADE_ENABLED
        value: "1"