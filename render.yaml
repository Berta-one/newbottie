services:
  - type: web
    name: bottie-api
    runtime: python
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: |
      python -m pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn api_app:app --host 0.0.0.0 --port $PORT
envVars:
  - key: PORT
    value: "10000"