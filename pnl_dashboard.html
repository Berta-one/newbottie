<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sntax P&L Report - Real-time Trading Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: #e6fffa;
            min-height: 100vh;
        }

        .header {
            background: rgba(26, 35, 50, 0.9);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-connected {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .status-disconnected {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: rgba(26, 35, 50, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .summary-card h3 {
            color: #64ffda;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .summary-change {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .positive { color: #4caf50; }
        .negative { color: #f44336; }
        .neutral { color: #ffa726; }

        .section {
            background: rgba(26, 35, 50, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 12px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .section-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            color: #64ffda;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .refresh-btn {
            background: linear-gradient(45deg, #64ffda, #4caf50);
            color: #0f1419;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
        }

        .trades-table {
            width: 100%;
            border-collapse: collapse;
        }

        .trades-table th,
        .trades-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        .trades-table th {
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .trades-table tbody tr:hover {
            background: rgba(100, 255, 218, 0.05);
        }

        .symbol-badge {
            background: rgba(100, 255, 218, 0.2);
            color: #64ffda;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .side-buy {
            color: #4caf50;
            font-weight: bold;
        }

        .side-sell {
            color: #f44336;
            font-weight: bold;
        }

        .pnl-positive {
            color: #4caf50;
            font-weight: bold;
        }

        .pnl-negative {
            color: #f44336;
            font-weight: bold;
        }

        .symbol-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            padding: 1.5rem;
        }

        .symbol-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(100, 255, 218, 0.1);
            border-radius: 8px;
            padding: 1rem;
        }

        .symbol-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .symbol-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: #64ffda;
        }

        .symbol-pnl {
            font-size: 1rem;
            font-weight: bold;
        }

        .symbol-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
        }

        .loading {
            text-align: center;
            color: #ffa726;
            padding: 3rem;
            font-size: 1.125rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .control-btn {
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.3);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(100, 255, 218, 0.2);
            transform: translateY(-2px);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .last-updated {
            font-size: 0.75rem;
            color: #a0aec0;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">📊 Sntax P&L Report</div>
            <div id="connectionStatus" class="connection-status status-disconnected">
                <span id="statusDot">🔴</span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="controls">
            <button class="control-btn" onclick="requestPnLReport()">🔄 Refresh Report</button>
            <button class="control-btn" onclick="simulateTrade()">🧪 Simulate Trade</button>
            <button class="control-btn" onclick="exportReport()">📄 Export Report</button>
        </div>

        <div class="summary-grid" id="summaryGrid">
            <div class="loading">Connecting to WebSocket server...</div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2 class="section-title">📈 Recent Trades</h2>
                <button class="refresh-btn" onclick="requestTrades()">Refresh</button>
            </div>
            <div id="tradesContainer">
                <div class="loading">Loading trades...</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2 class="section-title">🎯 Symbol Breakdown</h2>
            </div>
            <div id="symbolBreakdown">
                <div class="loading">Loading symbol analysis...</div>
            </div>
        </div>

        <div class="last-updated" id="lastUpdated">
            Last updated: Never
        </div>
    </div>

    <script>
        class PnLDashboard {
            constructor() {
                this.ws = null;
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.reconnectDelay = 3000;
                this.isConnected = false;
                this.lastData = null;
                
                this.init();
            }

            init() {
                this.connect();
                this.setupEventListeners();
            }

            connect() {
                console.log('🔌 Attempting to connect to WebSocket server...');
                
                try {
                    this.ws = new WebSocket('ws://localhost:8765');
                    
                    this.ws.onopen = () => {
                        console.log('✅ WebSocket connected');
                        this.isConnected = true;
                        this.reconnectAttempts = 0;
                        this.updateConnectionStatus(true);
                        this.requestPnLReport();
                    };
                    
                    this.ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            this.handleMessage(data);
                        } catch (error) {
                            console.error('❌ Error parsing WebSocket message:', error);
                        }
                    };
                    
                    this.ws.onclose = () => {
                        console.log('🔌 WebSocket disconnected');
                        this.isConnected = false;
                        this.updateConnectionStatus(false);
                        this.attemptReconnect();
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('❌ WebSocket error:', error);
                        this.updateConnectionStatus(false);
                    };
                    
                } catch (error) {
                    console.error('❌ Error creating WebSocket connection:', error);
                    this.updateConnectionStatus(false);
                    this.attemptReconnect();
                }
            }

            attemptReconnect() {
                if (this.reconnectAttempts < this.maxReconnectAttempts) {
                    this.reconnectAttempts++;
                    console.log(`🔄 Attempting reconnect ${this.reconnectAttempts}/${this.maxReconnectAttempts}...`);
                    
                    setTimeout(() => {
                        this.connect();
                    }, this.reconnectDelay);
                } else {
                    console.error('❌ Max reconnection attempts reached');
                    document.getElementById('summaryGrid').innerHTML = `
                        <div class="loading">
                            ❌ Unable to connect to WebSocket server<br>
                            <small>Make sure the P&L server is running on localhost:8765</small><br>
                            <button class="control-btn" onclick="location.reload()" style="margin-top: 1rem;">🔄 Retry Connection</button>
                        </div>
                    `;
                }
            }

            updateConnectionStatus(connected) {
                const statusElement = document.getElementById('connectionStatus');
                const dotElement = document.getElementById('statusDot');
                const textElement = document.getElementById('statusText');
                
                if (connected) {
                    statusElement.className = 'connection-status status-connected';
                    dotElement.textContent = '🟢';
                    textElement.textContent = 'Connected';
                } else {
                    statusElement.className = 'connection-status status-disconnected';
                    dotElement.textContent = '🔴';
                    textElement.textContent = this.reconnectAttempts > 0 ? 'Reconnecting...' : 'Disconnected';
                }
            }

            handleMessage(data) {
                console.log('📨 Received message:', data.type);
                
                switch (data.type) {
                    case 'pnl_update':
                        this.updatePnLData(data.data);
                        break;
                    case 'trades_response':
                        this.updateTradesTable(data.data);
                        break;
                    default:
                        console.log('Unknown message type:', data.type);
                }
                
                this.updateLastUpdated();
            }

            updatePnLData(data) {
                this.lastData = data;
                this.renderSummaryCards(data.summary);
                this.renderSymbolBreakdown(data.summary.symbol_breakdown);
                this.updateTradesTable(data.recent_trades);
            }

            renderSummaryCards(summary) {
                const summaryGrid = document.getElementById('summaryGrid');
                
                const totalPnL = summary.total_pnl || 0;
                const totalTrades = summary.total_trades || 0;
                const winRate = summary.win_rate || 0;
                const avgPnL = summary.avg_pnl_per_trade || 0;
                
                summaryGrid.innerHTML = `
                    <div class="summary-card">
                        <h3>Total P&L</h3>
                        <div class="summary-value ${totalPnL >= 0 ? 'positive' : 'negative'}">
                            $${totalPnL.toFixed(2)}
                        </div>
                        <div class="summary-change">Since August 1st</div>
                    </div>
                    
                    <div class="summary-card">
                        <h3>Total Trades</h3>
                        <div class="summary-value neutral">
                            ${totalTrades}
                        </div>
                        <div class="summary-change">
                            ${summary.winning_trades || 0} wins • ${summary.losing_trades || 0} losses
                        </div>
                    </div>
                    
                    <div class="summary-card">
                        <h3>Win Rate</h3>
                        <div class="summary-value ${winRate >= 60 ? 'positive' : winRate >= 40 ? 'neutral' : 'negative'}">
                            ${winRate.toFixed(1)}%
                        </div>
                        <div class="summary-change">Success rate</div>
                    </div>
                    
                    <div class="summary-card">
                        <h3>Avg P&L per Trade</h3>
                        <div class="summary-value ${avgPnL >= 0 ? 'positive' : 'negative'}">
                            $${avgPnL.toFixed(2)}
                        </div>
                        <div class="summary-change">Per trade average</div>
                    </div>
                `;
            }

            renderSymbolBreakdown(symbolData) {
                const container = document.getElementById('symbolBreakdown');
                
                if (!symbolData || Object.keys(symbolData).length === 0) {
                    container.innerHTML = '<div class="loading">No symbol data available</div>';
                    return;
                }
                
                let html = '<div class="symbol-breakdown">';
                
                Object.entries(symbolData).forEach(([symbol, stats]) => {
                    const pnlClass = stats.total_pnl >= 0 ? 'positive' : 'negative';
                    
                    html += `
                        <div class="symbol-card">
                            <div class="symbol-header">
                                <div class="symbol-name">${symbol}</div>
                                <div class="symbol-pnl ${pnlClass}">$${stats.total_pnl.toFixed(2)}</div>
                            </div>
                            <div class="symbol-stats">
                                <div class="stat-item">
                                    <span>Trades:</span>
                                    <span>${stats.trades}</span>
                                </div>
                                <div class="stat-item">
                                    <span>Win Rate:</span>
                                    <span>${stats.win_rate.toFixed(1)}%</span>
                                </div>
                                <div class="stat-item">
                                    <span>Volume:</span>
                                    <span>$${stats.total_volume.toFixed(2)}</span>
                                </div>
                                <div class="stat-item">
                                    <span>Avg Win:</span>
                                    <span class="positive">$${stats.avg_win.toFixed(2)}</span>
                                </div>
                                <div class="stat-item">
                                    <span>Avg Loss:</span>
                                    <span class="negative">$${stats.avg_loss.toFixed(2)}</span>
                                </div>
                                <div class="stat-item">
                                    <span>Best Trade:</span>
                                    <span class="positive">$${stats.largest_win.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
            }

            updateTradesTable(trades) {
                const container = document.getElementById('tradesContainer');
                
                if (!trades || trades.length === 0) {
                    container.innerHTML = '<div class="loading">No trades found</div>';
                    return;
                }
                
                let html = `
                    <table class="trades-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>Amount</th>
                                <th>Price</th>
                                <th>Cost</th>
                                <th>P&L</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                trades.forEach(trade => {
                    const date = new Date(trade.timestamp).toLocaleString();
                    const pnlClass = trade.pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
                    const sideClass = trade.side.toLowerCase() === 'buy' ? 'side-buy' : 'side-sell';
                    
                    html += `
                        <tr>
                            <td>${date}</td>
                            <td><span class="symbol-badge">${trade.symbol}</span></td>
                            <td><span class="${sideClass}">${trade.side.toUpperCase()}</span></td>
                            <td>${parseFloat(trade.amount).toFixed(6)}</td>
                            <td>$${parseFloat(trade.price).toFixed(2)}</td>
                            <td>$${parseFloat(trade.cost || 0).toFixed(2)}</td>
                            <td><span class="${pnlClass}">$${parseFloat(trade.pnl || 0).toFixed(2)}</span></td>
                            <td>${trade.status}</td>
                        </tr>
                    `;
                });
                
                html += '</tbody></table>';
                container.innerHTML = html;
            }

            updateLastUpdated() {
                const element = document.getElementById('lastUpdated');
                element.textContent = `Last updated: ${new Date().toLocaleString()}`;
            }

            sendMessage(message) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(message));
                } else {
                    console.error('❌ WebSocket not connected');
                }
            }

            requestPnLReport() {
                this.sendMessage({ type: 'get_pnl_report' });
            }

            requestTrades() {
                this.sendMessage({ 
                    type: 'get_trades',
                    since_date: '2024-08-01'
                });
            }

            simulateTrade() {
                const symbols = ['BTCUSDT', 'ETHUSDT', 'ADAUSDT', 'BNBUSDT'];
                const sides = ['buy', 'sell'];
                const amounts = [0.001, 0.01, 0.1, 1];
                
                const symbol = symbols[Math.floor(Math.random() * symbols.length)];
                const side = sides[Math.floor(Math.random() * sides.length)];
                const amount = amounts[Math.floor(Math.random() * amounts.length)];
                
                this.sendMessage({
                    type: 'simulate_trade',
                    symbol: symbol,
                    side: side,
                    amount: amount
                });
                
                console.log(`🧪 Simulated trade: ${symbol} ${side} ${amount}`);
            }

            exportReport() {
                if (!this.lastData) {
                    alert('No data available to export');
                    return;
                }
                
                const reportData = {
                    generated_at: new Date().toISOString(),
                    summary: this.lastData.summary,
                    trades: this.lastData.recent_trades
                };
                
                const dataStr = JSON.stringify(reportData, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(dataBlob);
                link.download = `sntax_pnl_report_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                
                console.log('📄 P&L report exported');
            }

            setupEventListeners() {
                // Auto-refresh every 30 seconds
                setInterval(() => {
                    if (this.isConnected) {
                        this.requestPnLReport();
                    }
                }, 30000);
            }
        }

        // Global functions for button clicks
        function requestPnLReport() {
            if (window.dashboard) {
                window.dashboard.requestPnLReport();
            }
        }

        function simulateTrade() {
            if (window.dashboard) {
                window.dashboard.simulateTrade();
            }
        }

        function requestTrades() {
            if (window.dashboard) {
                window.dashboard.requestTrades();
            }
        }

        function exportReport() {
            if (window.dashboard) {
                window.dashboard.exportReport();
            }
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Initializing P&L Dashboard...');
            window.dashboard = new PnLDashboard();
        });
    </script>
</body>
</html>
