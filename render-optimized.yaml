services:
  - type: web
    name: bottie-lightweight
    env: python
    region: oregon
    plan: free  # 512MB memory limit
    
    # Memory-optimized build process
    buildCommand: |
      echo "🚀 Starting memory-optimized build..."
      pip install --no-cache-dir --no-compile -r requirements-lightweight.txt
      echo "🧹 Cleaning up build artifacts..."
      pip cache purge
      find . -name "*.pyc" -delete 2>/dev/null || true
      find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
      echo "✅ Memory-optimized build completed"
    
    # Start the lightweight dashboard
    startCommand: python lightweight_dashboard_api.py
    
    # Memory optimization environment variables
    envVars:
      # Core settings
      - key: PORT
        value: "8000"
      - key: DEMO_MODE
        value: "1"  # Enable demo mode for testing (set to 0 for real trading)
      
      # Memory management (critical for 512MB limit)
      - key: MAX_MEMORY_MB
        value: "400"  # Stay well under 512MB limit
      - key: MAX_STORED_RECORDS
        value: "500"   # Reduced from 1000
      - key: MAX_LOG_ENTRIES
        value: "200"   # Reduced from 500
      - key: CLEANUP_INTERVAL
        value: "300"   # Cleanup every 5 minutes
      - key: GC_INTERVAL
        value: "60"    # Garbage collection every minute
      
      # WebSocket optimization
      - key: MAX_WEBSOCKET_CONNECTIONS
        value: "10"    # Limit concurrent connections
      - key: WEBSOCKET_BROADCAST_INTERVAL
        value: "15"    # Broadcast every 15 seconds
      
      # Data collection optimization
      - key: UPDATE_INTERVAL
        value: "60"    # Update every 60 seconds (reduced frequency)
      - key: BALANCE_UPDATE_INTERVAL
        value: "600"   # Balance update every 10 minutes
      
      # Python optimization
      - key: PYTHONOPTIMIZE
        value: "2"     # Enable Python optimizations
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"     # Don't create .pyc files
      - key: PYTHONUNBUFFERED
        value: "1"     # Unbuffered output
      
      # Trading settings (for real trading mode)
      - key: BINANCE_API_KEY
        sync: false    # Set in Render dashboard
      - key: BINANCE_API_SECRET
        sync: false    # Set in Render dashboard
      - key: BINANCE_TESTNET
        value: "true"  # Use testnet for safety
      
      # Logging optimization
      - key: LOG_LEVEL
        value: "INFO"
      - key: DISABLE_ACCESS_LOG
        value: "1"     # Disable uvicorn access logs
    
    # Health check configuration
    healthCheckPath: /health
    
    # Auto-deploy settings
    autoDeploy: true
    
    # Build optimization - only include necessary files
    buildFilter:
      paths:
        - lightweight_dashboard_api.py
        - requirements-lightweight.txt
        - render-optimized.yaml
      ignoredPaths:
        - tests/
        - docs/
        - "*.md"
        - "*.log"
        - __pycache__/
        - "*.pyc"
        - venv/
        - .env*
        - api/  # Use lightweight version instead
        - web/  # Integrated into single file