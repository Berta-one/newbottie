<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test - Sntax</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: #e6fffa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-box {
            background: rgba(26, 35, 50, 0.9);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 12px;
            padding: 3rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }
        .login-input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #e6fffa;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .login-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            color: #0f1419;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .login-button:hover {
            transform: translateY(-2px);
        }
        .login-error {
            color: #f44336;
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        .success {
            color: #4caf50;
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: bold;
        }
        .debug {
            background: rgba(0,0,0,0.5);
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.875rem;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1 class="login-title">🔧 Sntax Login Test</h1>
        <p style="color: #a0aec0; margin-bottom: 2rem;">Testing login functionality</p>
        
        <input type="password" id="passwordInput" class="login-input" placeholder="Enter password: bottie2024">
        <button onclick="testLogin()" class="login-button">Test Login</button>
        
        <div id="loginError" class="login-error"></div>
        <div id="loginSuccess" class="success" style="display: none;"></div>
        <div id="debug" class="debug"></div>
        
        <div style="margin-top: 2rem; color: #64ffda; font-size: 0.875rem;">
            <p><strong>Correct Password:</strong> bottie2024</p>
            <p><strong>Test Cases:</strong></p>
            <ul style="text-align: left; margin: 0.5rem 0;">
                <li>Try: bottie2024</li>
                <li>Try: wrong password</li>
                <li>Try: empty password</li>
            </ul>
        </div>
    </div>

    <script>
        const DASHBOARD_PASSWORD = 'bottie2024';
        
        function testLogin() {
            console.log('🔧 Testing login...');
            
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');
            const debugDiv = document.getElementById('debug');
            
            // Clear previous messages
            errorDiv.textContent = '';
            successDiv.style.display = 'none';
            
            // Debug info
            let debugInfo = `
Debug Info:
- Password entered: "${password}"
- Expected password: "${DASHBOARD_PASSWORD}"
- Password length: ${password.length}
- Expected length: ${DASHBOARD_PASSWORD.length}
- Exact match: ${password === DASHBOARD_PASSWORD}
- Type of password: ${typeof password}
- Type of expected: ${typeof DASHBOARD_PASSWORD}
            `;
            
            debugDiv.textContent = debugInfo;
            console.log(debugInfo);
            
            if (password === DASHBOARD_PASSWORD) {
                successDiv.textContent = '✅ LOGIN SUCCESS! Password is correct.';
                successDiv.style.display = 'block';
                console.log('✅ Login successful');
                
                // Test redirect to main dashboard
                setTimeout(() => {
                    if (confirm('Login successful! Redirect to main dashboard?')) {
                        window.location.href = '/index.html';
                    }
                }, 1000);
                
            } else {
                errorDiv.textContent = '❌ Invalid password. Please try again.';
                console.log('❌ Login failed');
                document.getElementById('passwordInput').value = '';
            }
        }
        
        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                testLogin();
            }
        });
        
        // Auto-focus password input
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('passwordInput').focus();
            console.log('🌟 Login test page loaded');
        });
    </script>
</body>
</html>
