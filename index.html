<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sntax Trading Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: #e6fffa;
            min-height: 100vh;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-box {
            background: rgba(26, 35, 50, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 12px;
            padding: 3rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .login-input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #e6fffa;
            font-size: 1rem;
        }

        .login-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            color: #0f1419;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
        }

        .login-error {
            color: #f44336;
            margin-top: 1rem;
            font-size: 0.875rem;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            min-height: 100vh;
        }

        .dashboard.authenticated {
            display: block;
        }

        .header {
            background: rgba(26, 35, 50, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .trading-control {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
        }

        .start-trading {
            background: linear-gradient(45deg, #4caf50, #45a049);
            color: white;
        }

        .stop-trading {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .trading-control:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .trading-status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.2);
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .slate {
            background: rgba(26, 35, 50, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slate:hover {
            transform: translateY(-5px);
            border-color: rgba(100, 255, 218, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .slate-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .slate-icon {
            font-size: 1.5rem;
        }

        .slate-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #64ffda;
        }

        .slate-content {
            color: #a0aec0;
            line-height: 1.6;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .loading {
            text-align: center;
            color: #ffa726;
            padding: 2rem;
        }

        /* Modal Styles */
        .signals-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .signals-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 35, 50, 0.95);
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 12px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            padding: 0;
        }

        .signals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
        }

        .signals-title {
            color: #64ffda;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: #f44336;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(244, 67, 54, 0.1);
        }

        /* Data Table Styles */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: rgba(26, 35, 50, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        .data-table th,
        .data-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        .data-table th {
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .data-table tbody tr:hover {
            background: rgba(100, 255, 218, 0.05);
        }

        /* Status Styles */
        .status-pending { color: #ffa726; }
        .status-filled { color: #4caf50; }
        .status-cancelled { color: #f44336; }
        .status-rejected { color: #f44336; }

        /* Signal Styles */
        .signal-buy { 
            color: #4caf50; 
            background: rgba(76, 175, 80, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .signal-sell { 
            color: #f44336; 
            background: rgba(244, 67, 54, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .signal-hold { 
            color: #ffa726; 
            background: rgba(255, 167, 38, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Metric Styles */
        .sentiment-overview, .ml-overview, .health-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .sentiment-metric, .ml-metric, .health-metric {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem;
            background: rgba(26, 35, 50, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1 class="login-title">⚡ Sntax Dashboard</h1>
            <p style="color: #a0aec0; margin-bottom: 2rem;">Enter password to access trading dashboard</p>
            <input type="password" id="passwordInput" class="login-input" placeholder="Enter password">
            <button onclick="authenticate()" class="login-button">Access Dashboard</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="dashboard">
        <div class="header">
            <div class="logo">⚡ Sntax Trading Dashboard 🚀</div>
            <div class="controls">
                <div id="tradingStatus" class="trading-status">
                    <span id="statusText">Checking...</span>
                </div>
                <button onclick="startTrading()" class="trading-control start-trading">▶️ Start Trading</button>
                <button onclick="stopTrading()" class="trading-control stop-trading">⏹️ Stop Trading</button>
                <button onclick="window.open('/bulletin/page', '_blank')" class="trading-control" style="background: linear-gradient(45deg, #64ffda, #4caf50); color: #0f1419;">🤖 AI Bulletin</button>
                <button onclick="logout()" class="trading-control" style="background: rgba(255, 107, 107, 0.2); color: #ff6b6b;">🚪 Logout</button>
            </div>
        </div>

        <div class="main-grid" id="slates-container">
            <!-- Slates will be dynamically generated here -->
        </div>
    </div>

    <!-- Trading Signals Modal -->
    <div id="signalsModal" class="signals-modal">
        <div class="signals-content">
            <div class="signals-header">
                <h2 class="signals-title">🎯 Trading Signals & Arbitrage Opportunities</h2>
                <button onclick="closeSignalsModal()" class="close-btn">✕</button>
            </div>
            <div id="signalsTableContainer" class="loading">Loading signals...</div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://127.0.0.1:8000' 
            : 'https://bottie-1.onrender.com';
        
        // Single valid password
        const DASHBOARD_PASSWORD = 'bottie2024';
        let isAuthenticated = false;

        // Authentication with single password
        function authenticate() {
            console.log('🔧 Authenticate function called');
            
            const password = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('loginError');
            
            console.log('Password entered:', `"${password}"`);
            console.log('Expected password:', DASHBOARD_PASSWORD);
            console.log('Password match:', password === DASHBOARD_PASSWORD);
            
            if (password === DASHBOARD_PASSWORD) {
                console.log('✅ Login successful');
                isAuthenticated = true;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').classList.add('authenticated');
                initDashboard();
                errorDiv.textContent = '';
            } else {
                console.log('❌ Login failed');
                errorDiv.innerHTML = `
                    <div style="color: #f44336; margin-top: 1rem;">
                        ❌ Invalid password. Please try again.
                    </div>
                `;
                document.getElementById('passwordInput').value = '';
            }
        }

        function logout() {
            isAuthenticated = false;
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('authenticated');
        }



        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isAuthenticated) {
                authenticate();
            }
        });

        class EnhancedDashboard {
            constructor() {
                this.apiUrl = API_BASE;
                this.endpoints = [
                    { name: 'equity', title: 'Portfolio Equity', icon: '💰', endpoint: '/status' },
                    { name: 'signals', title: 'Trading Signals', icon: '🎯', endpoint: '/signals', special: 'signals_table' },
                    { name: 'trades', title: 'Trade History', icon: '📈', endpoint: '/trades/history' },
                    { name: 'trading_status', title: 'Trading Controls', icon: '🎛️', endpoint: '/trading/status' },
                    { name: 'ml', title: 'ML Performance', icon: '🧠', endpoint: '/ml/status' },
                    { name: 'quantum', title: 'Quantum Analysis', icon: '⚛️', endpoint: '/quantum/analysis' },
                    { name: 'sentiment', title: 'Sentiment Analysis', icon: '📰', endpoint: '/sentiment' },
                    { name: 'positions', title: 'Current Positions', icon: '💼', endpoint: '/positions' },
                    { name: 'health', title: 'System Health', icon: '🔋', endpoint: '/health' },
                    { name: 'logs', title: 'System Logs', icon: '📝', endpoint: '/logs' }
                ];
                this.endpointData = {};
                this.init();
            }

            async init() {
                console.log('🚀 Initializing Enhanced Dashboard...');
                await this.loadAllEndpoints();
                this.renderSlates();
                this.updateTradingStatus();
                
                setInterval(() => {
                    this.loadAllEndpoints();
                    this.updateSlateMetrics();
                    this.updateTradingStatus();
                }, 10000);
            }

            async loadAllEndpoints() {
                const promises = this.endpoints.map(endpoint => this.loadEndpoint(endpoint));
                await Promise.allSettled(promises);
            }

            async loadEndpoint(endpoint) {
                try {
                    const response = await fetch(`${this.apiUrl}${endpoint.endpoint}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    // Check if response is actually JSON
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        const text = await response.text();
                        throw new Error(`Expected JSON but got ${contentType}. Response: ${text.substring(0, 100)}`);
                    }
                    
                    const data = await response.json();
                    console.log(`✅ Loaded ${endpoint.name}:`, Object.keys(data));
                    this.endpointData[endpoint.name] = data;
                } catch (error) {
                    console.log(`❌ Error loading ${endpoint.name}:`, error.message);
                    this.endpointData[endpoint.name] = null;
                }
            }

            renderSlates() {
                const container = document.getElementById('slates-container');
                container.innerHTML = '';

                this.endpoints.forEach(endpoint => {
                    const slate = document.createElement('div');
                    slate.className = 'slate';
                    slate.onclick = () => this.handleSlateClick(endpoint);
                    
                    slate.innerHTML = `
                        <div class="slate-header">
                            <span class="slate-icon">${endpoint.icon}</span>
                            <span class="slate-title">${endpoint.title}</span>
                        </div>
                        <div class="slate-content" id="content-${endpoint.name}">
                            <div class="loading">Loading...</div>
                        </div>
                    `;
                    
                    container.appendChild(slate);
                });

                this.updateSlateMetrics();
            }

            updateSlateMetrics() {
                this.endpoints.forEach(endpoint => {
                    const contentDiv = document.getElementById(`content-${endpoint.name}`);
                    const data = this.endpointData[endpoint.name];
                    
                    if (data) {
                        contentDiv.innerHTML = this.formatSlateContent(endpoint, data);
                    } else {
                        contentDiv.innerHTML = '<div style="color: #f44336;">Error loading data</div>';
                    }
                });
            }

            formatSlateContent(endpoint, data) {
                switch (endpoint.name) {
                    case 'equity':
                        const equity = data.equity?.display_value || data.equity || 0;
                        const posCount = data.positions ? Object.keys(data.positions).length : 0;
                        return `
                            <div class="metric">
                                <span>Total Equity:</span>
                                <span style="color: #4caf50; font-weight: 600;">$${equity.toFixed(2)}</span>
                            </div>
                            <div class="metric">
                                <span>Active Positions:</span>
                                <span>${posCount}</span>
                            </div>
                        `;

                    case 'signals':
                        const signals = data.signals || [];
                        const buySignals = signals.filter(s => s.signal === 'BUY').length;
                        const sellSignals = signals.filter(s => s.signal === 'SELL').length;
                        const holdSignals = signals.filter(s => s.signal === 'HOLD').length;
                        return `
                            <div class="metric">
                                <span>🟢 BUY Signals:</span>
                                <span>${buySignals}</span>
                            </div>
                            <div class="metric">
                                <span>🔴 SELL Signals:</span>
                                <span>${sellSignals}</span>
                            </div>
                            <div class="metric">
                                <span>🟡 HOLD Signals:</span>
                                <span>${holdSignals}</span>
                            </div>
                            <div style="margin-top: 1rem; font-size: 0.75rem; color: #64ffda;">
                                Click to view detailed signals table
                            </div>
                        `;

                    case 'trading_status':
                        return `
                            <div class="metric">
                                <span>Trade Enabled:</span>
                                <span style="color: ${data.trade_enabled ? '#4caf50' : '#f44336'}">${data.trade_enabled ? 'Yes' : 'No'}</span>
                            </div>
                            <div class="metric">
                                <span>Execution Enabled:</span>
                                <span style="color: ${data.execution_enabled ? '#4caf50' : '#f44336'}">${data.execution_enabled ? 'Yes' : 'No'}</span>
                            </div>
                            <div class="metric">
                                <span>Recent Trades:</span>
                                <span>${data.recent_trades || 0}</span>
                            </div>
                        `;

                    case 'trades':
                        const trades = data.trades || [];
                        const summary = data.summary || {};
                        const recentTrades = trades.slice(0, 3);
                        
                        const totalPnL = summary.net_pnl || 0;
                        const totalTrades = summary.total_trades || trades.length;
                        const totalFees = summary.total_fees || 0;
                        
                        return `
                            <div class="metric">
                                <span>Total P&L (Aug 1st):</span>
                                <span style="color: ${totalPnL >= 0 ? '#4caf50' : '#f44336'}; font-weight: bold;">$${totalPnL.toFixed(2)}</span>
                            </div>
                            <div class="metric">
                                <span>Total Trades:</span>
                                <span>${totalTrades}</span>
                            </div>
                            <div class="metric">
                                <span>Total Fees:</span>
                                <span style="color: #f44336;">$${totalFees.toFixed(4)}</span>
                            </div>
                            <div style="margin-top: 1rem; font-size: 0.75rem; color: #64ffda;">
                                Click to view detailed trades history with P&L
                            </div>
                        `;

                    case 'logs':
                        const logs = data.logs || [];
                        const recentLogs = logs.slice(-3);
                        return recentLogs.map(log => `
                            <div style="font-family: monospace; font-size: 0.75rem; margin-bottom: 0.5rem; color: #a0aec0;">
                                ${log.substring(0, 60)}...
                            </div>
                        `).join('');

                    default:
                        return '<div>Click to view details</div>';
                }
            }

            handleSlateClick(endpoint) {
                switch(endpoint.name) {
                    case 'signals':
                        this.showSignalsTable();
                        break;
                    case 'trades':
                        showTradesModal();
                        break;
                    case 'positions':
                        showPositionsModal();
                        break;
                    case 'sentiment':
                        showSentimentModal();
                        break;
                    case 'ml':
                        showMLModal();
                        break;
                    case 'logs':
                        showLogsModal();
                        break;
                    case 'health':
                        showHealthModal();
                        break;
                    default:
                        showGenericModal(endpoint);
                        break;
                }
            }

            async showSignalsTable() {
                document.getElementById('signalsModal').style.display = 'block';
                const container = document.getElementById('signalsTableContainer');
                container.innerHTML = '<div class="loading">Loading comprehensive signals analysis...</div>';

                try {
                    // Load signals and positions data
                    const [signalsRes, positionsRes] = await Promise.all([
                        fetch(`${this.apiUrl}/signals`),
                        fetch(`${this.apiUrl}/status`)
                    ]);

                    // Safely parse JSON responses
                    let signalsData = {};
                    let statusData = {};
                    
                    try {
                        if (signalsRes.ok && signalsRes.headers.get('content-type')?.includes('application/json')) {
                            signalsData = await signalsRes.json();
                        }
                    } catch (e) {
                        console.error('Error parsing signals response:', e);
                    }
                    
                    try {
                        if (positionsRes.ok && positionsRes.headers.get('content-type')?.includes('application/json')) {
                            statusData = await positionsRes.json();
                        }
                    } catch (e) {
                        console.error('Error parsing status response:', e);
                    }
                    
                    const signals = signalsData.signals || [];
                    const positions = statusData.positions || {};

                    // Create comprehensive signals table
                    let tableHTML = `
                        <table class="signals-table">
                            <thead>
                                <tr>
                                    <th>Symbol</th>
                                    <th>Signal</th>
                                    <th>Confidence</th>
                                    <th>Current Price</th>
                                    <th>Change %</th>
                                    <th>Position</th>
                                    <th>P&L</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    // Add signals from the signals endpoint
                    signals.forEach(signal => {
                        const position = positions[signal.symbol] || {};
                        const hasPosition = Object.keys(position).length > 0;
                        const pnl = position.pnl || 0;
                        const change = signal.change ? (signal.change * 100).toFixed(2) : 'N/A';
                        const price = signal.price ? signal.price.toFixed(2) : 'N/A';
                        
                        tableHTML += `
                            <tr>
                                <td><strong>${signal.symbol}</strong></td>
                                <td><span class="signal-${signal.signal.toLowerCase()}">${signal.signal}</span></td>
                                <td>${(signal.conf * 100).toFixed(1)}%</td>
                                <td>$${price}</td>
                                <td style="color: ${change > 0 ? '#4caf50' : '#f44336'}">${change}%</td>
                                <td>${hasPosition ? 'Yes' : 'No'}</td>
                                <td style="color: ${pnl > 0 ? '#4caf50' : '#f44336'}">$${pnl.toFixed(2)}</td>
                                <td><button onclick="alert('Trading action: ${signal.signal} ${signal.symbol}')" style="padding: 0.25rem 0.5rem; background: #64ffda; color: #0f1419; border: none; border-radius: 4px; cursor: pointer;">Execute</button></td>
                            </tr>
                        `;
                    });

                    tableHTML += '</tbody></table>';
                    container.innerHTML = tableHTML;

                } catch (error) {
                    container.innerHTML = `
                        <div style="text-align: center; color: #f44336; padding: 2rem;">
                            <div>❌ Error loading signals data</div>
                            <div style="font-size: 0.875rem; margin-top: 0.5rem;">${error.message}</div>
                        </div>
                    `;
                }
            }

            updateTradingStatus() {
                // Update trading status indicator
                const statusText = document.getElementById('statusText');
                if (statusText) {
                    statusText.textContent = 'Active';
                }
            }
        }

        // Trading Controls
        async function startTrading() {
            try {
                console.log('🔧 Starting trading...');
                const response = await fetch(`${API_BASE}/trading/start`, { 
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Expected JSON response but got ${contentType}`);
                }
                
                const data = await response.json();

        async function showDataModal(title, endpoint, formatter) {
            // Create or update modal
            let modal = document.getElementById('dataModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'dataModal';
                modal.className = 'signals-modal';
                modal.innerHTML = `
                    <div class="signals-content">
                        <div class="signals-header">
                            <h2 class="signals-title" id="modalTitle">${title}</h2>
                            <button onclick="closeDataModal()" class="close-btn">✕</button>
                        </div>
                        <div id="modalContent" class="loading" style="padding: 1.5rem;">Loading...</div>
                    </div>
                `;
                document.body.appendChild(modal);
            }
            
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalContent').innerHTML = '<div class="loading">Loading...</div>';
            modal.style.display = 'block';
            
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Expected JSON but got ${contentType}. Response: ${text.substring(0, 100)}`);
                }
                
                const data = await response.json();
                document.getElementById('modalContent').innerHTML = formatter(data);
            } catch (error) {
                console.error('Modal data fetch error:', error);
                document.getElementById('modalContent').innerHTML = `
                    <div style="text-align: center; color: #f44336; padding: 2rem;">
                        <div>❌ Error loading data</div>
                        <div style="font-size: 0.875rem; margin-top: 0.5rem;">${error.message}</div>
                    </div>
                `;
            }
        }

        function closeSignalsModal() {
            document.getElementById('signalsModal').style.display = 'none';
        }

        function closeDataModal() {
            const modal = document.getElementById('dataModal');
            if (modal) modal.style.display = 'none';
        }

        // Close modal when clicking outside
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('signalsModal');
            if (modal && e.target === modal) {
                closeSignalsModal();
            }
            const dataModal = document.getElementById('dataModal');
            if (dataModal && e.target === dataModal) {
                closeDataModal();
            }
        });
