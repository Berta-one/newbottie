<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard - WORKING VERSION</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-chart-line text-2xl"></i>
                    <h1 class="text-2xl font-bold">Trading Dashboard - WORKING</h1>
                </div>
                <button onclick="loadData()" class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-lg">
                    <i class="fas fa-sync-alt mr-2"></i>Refresh
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-lg font-semibold mb-4">API Status</h3>
                <div id="apiStatus">Testing...</div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-lg font-semibold mb-4">Trading Data</h3>
                <div id="tradingData">Loading...</div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-lg font-semibold mb-4">ML Data</h3>
                <div id="mlData">Loading...</div>
            </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-lg font-semibold mb-4">Debug Console</h3>
            <div id="debugOutput" class="bg-gray-100 p-4 rounded font-mono text-sm max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // INLINE JAVASCRIPT - NO CACHE POSSIBLE
        console.log('🚀 WORKING VERSION LOADED - NO CACHE ISSUES');
        
        const API_BASE = 'https://bottie-1.onrender.com';  // NO /api prefix
        
        function log(message) {
            console.log(message);
            const output = document.getElementById('debugOutput');
            output.innerHTML += message + '<br>';
            output.scrollTop = output.scrollHeight;
        }
        
        async function testAPI(endpoint, description) {
            const url = `${API_BASE}${endpoint}`;
            log(`🔍 Testing ${description}: ${url}`);
            
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    credentials: 'omit',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                log(`📊 ${description} Response: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ ${description} SUCCESS - Data received`);
                    return { success: true, data: data };
                } else {
                    log(`❌ ${description} FAILED: ${response.status}`);
                    return { success: false, error: `HTTP ${response.status}` };
                }
            } catch (error) {
                log(`💥 ${description} ERROR: ${error.message}`);
                return { success: false, error: error.message };
            }
        }
        
        async function loadData() {
            log('🔄 Starting API tests...');
            document.getElementById('apiStatus').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Testing...';
            document.getElementById('tradingData').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            document.getElementById('mlData').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            
            // Test health endpoint
            const health = await testAPI('/health', 'Health Check');
            document.getElementById('apiStatus').innerHTML = health.success 
                ? '<span class="text-green-600">✅ API Online</span>'
                : '<span class="text-red-600">❌ API Offline</span>';
            
            // Test trades endpoint
            const trades = await testAPI('/trades', 'Trading Data');
            if (trades.success && trades.data.trades) {
                const tradesCount = trades.data.trades.length;
                const totalPnL = trades.data.summary?.net_pnl || 0;
                document.getElementById('tradingData').innerHTML = `
                    <div class="space-y-2">
                        <div>Trades: <span class="font-bold">${tradesCount}</span></div>
                        <div>P&L: <span class="font-bold ${totalPnL >= 0 ? 'text-green-600' : 'text-red-600'}">$${totalPnL.toFixed(2)}</span></div>
                    </div>
                `;
                log(`📈 Trading: ${tradesCount} trades, P&L: $${totalPnL.toFixed(2)}`);
            } else {
                document.getElementById('tradingData').innerHTML = '<span class="text-red-600">❌ No Data</span>';
            }
            
            // Test ML endpoint
            const ml = await testAPI('/ml/status', 'ML Status');
            if (ml.success && ml.data) {
                const accuracy = (ml.data.accuracy * 100).toFixed(1);
                const predictions = ml.data.total_predictions || 0;
                document.getElementById('mlData').innerHTML = `
                    <div class="space-y-2">
                        <div>Accuracy: <span class="font-bold text-green-600">${accuracy}%</span></div>
                        <div>Predictions: <span class="font-bold">${predictions}</span></div>
                    </div>
                `;
                log(`🧠 ML: ${accuracy}% accuracy, ${predictions} predictions`);
            } else {
                document.getElementById('mlData').innerHTML = '<span class="text-red-600">❌ No Data</span>';
            }
            
            log('✅ All tests completed!');
        }
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', () => {
            log('🌟 Dashboard loaded - testing API...');
            loadData();
        });
    </script>
</body>
</html>
