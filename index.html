<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sntax Trading Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: #e6fffa;
            min-height: 100vh;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-box {
            background: rgba(26, 35, 50, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 12px;
            padding: 3rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .login-input {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 20, 25, 0.8);
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 8px;
            color: #e6fffa;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .login-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            border: none;
            border-radius: 8px;
            color: #0f1419;
            font-weight: 600;
            cursor: pointer;
        }

        .login-error {
            color: #ff6b6b;
            margin-top: 1rem;
            font-size: 0.875rem;
        }

        /* Main Dashboard */
        .dashboard {
            display: none;
        }

        .dashboard.authenticated {
            display: block;
        }

        .header {
            background: rgba(26, 35, 50, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #64ffda, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .trading-control {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-trading {
            background: linear-gradient(45deg, #4caf50, #45a049);
            color: white;
        }

        .stop-trading {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .main-grid {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .slate {
            background: rgba(26, 35, 50, 0.8);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slate:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: #64ffda;
        }

        .slate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .slate-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #64ffda;
        }

        .slate-icon {
            font-size: 2rem;
        }

        .slate-content {
            color: #a0aec0;
            font-size: 0.875rem;
        }

        /* Signals Table Modal */
        .signals-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .signals-content {
            background: rgba(15, 20, 25, 0.95);
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 12px;
            max-width: 95%;
            max-height: 90%;
            overflow-y: auto;
            border: 1px solid rgba(100, 255, 218, 0.3);
        }

        .signals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
            padding-bottom: 1rem;
        }

        .signals-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #64ffda;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .signals-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .signals-table th,
        .signals-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        .signals-table th {
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            font-weight: 600;
        }

        .signal-buy {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .signal-sell {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .signal-hold {
            background: rgba(255, 167, 38, 0.2);
            color: #ffa726;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .arbitrage-opportunity {
            background: rgba(156, 39, 176, 0.2);
            color: #9c27b0;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .confidence-high {
            color: #4caf50;
            font-weight: 600;
        }

        .confidence-medium {
            color: #ffa726;
            font-weight: 600;
        }

        .confidence-low {
            color: #f44336;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: #64ffda;
            padding: 2rem;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        .metric:last-child {
            border-bottom: none;
        }

        .trading-status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .trading-enabled {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .trading-disabled {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        /* Data Table Styles */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: rgba(26, 35, 50, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        .data-table th,
        .data-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        .data-table th {
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .data-table tbody tr:hover {
            background: rgba(100, 255, 218, 0.05);
        }

        /* Status Styles */
        .status-pending { color: #ffa726; }
        .status-filled { color: #4caf50; }
        .status-cancelled { color: #f44336; }
        .status-rejected { color: #f44336; }

        /* Confidence Styles */
        .confidence-high { color: #4caf50; font-weight: bold; }
        .confidence-medium { color: #ffa726; font-weight: bold; }
        .confidence-low { color: #f44336; font-weight: bold; }

        /* Signal Styles */
        .signal-buy { 
            color: #4caf50; 
            background: rgba(76, 175, 80, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .signal-sell { 
            color: #f44336; 
            background: rgba(244, 67, 54, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .signal-hold { 
            color: #ffa726; 
            background: rgba(255, 167, 38, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Metric Styles */
        .sentiment-overview, .ml-overview, .health-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .sentiment-metric, .ml-metric, .health-metric {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem;
            background: rgba(26, 35, 50, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        /* Logs Styles */
        .logs-container {
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
        }

        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-radius: 4px;
            border-left: 3px solid;
        }

        .log-error {
            background: rgba(244, 67, 54, 0.1);
            border-left-color: #f44336;
            color: #ffcdd2;
        }

        .log-warning {
            background: rgba(255, 167, 38, 0.1);
            border-left-color: #ffa726;
            color: #ffe0b2;
        }

        .log-success {
            background: rgba(76, 175, 80, 0.1);
            border-left-color: #4caf50;
            color: #c8e6c9;
        }

        .log-info {
            background: rgba(100, 255, 218, 0.1);
            border-left-color: #64ffda;
            color: #e0f2f1;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1 class="login-title">🤖 Sntax Dashboard</h1>
            <p style="color: #a0aec0; margin-bottom: 2rem;">Enter password to access trading dashboard</p>
            <input type="password" id="passwordInput" class="login-input" placeholder="Enter password">
            <button onclick="authenticate()" class="login-button">Access Dashboard</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="dashboard">
        <div class="header">
            <div class="logo">⚡ Sntax Trading Dashboard 🚀</div>
            <div class="controls">
                <div id="tradingStatus" class="trading-status">
                    <span id="statusText">Checking...</span>
                </div>
                <button onclick="startTrading()" class="trading-control start-trading">▶️ Start Trading</button>
                <button onclick="stopTrading()" class="trading-control stop-trading">⏹️ Stop Trading</button>
                <button onclick="logout()" class="trading-control" style="background: rgba(255, 107, 107, 0.2); color: #ff6b6b;">🚪 Logout</button>
            </div>
        </div>

        <div class="main-grid" id="slates-container">
            <!-- Slates will be dynamically generated here -->
        </div>
    </div>

    <!-- Trading Signals Modal -->
    <div id="signalsModal" class="signals-modal">
        <div class="signals-content">
            <div class="signals-header">
                <h2 class="signals-title">🎯 Trading Signals & Arbitrage Opportunities</h2>
                <button onclick="closeSignalsModal()" class="close-btn">✕</button>
            </div>
            <div id="signalsTableContainer" class="loading">Loading signals...</div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://127.0.0.1:8000' 
            : 'https://bottie-1.onrender.com';
        
        const DASHBOARD_PASSWORD = 'bottie2024';
        let isAuthenticated = false;

        // Authentication
        function authenticate() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');
            
            if (password === DASHBOARD_PASSWORD) {
                isAuthenticated = true;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').classList.add('authenticated');
                initDashboard();
                errorDiv.textContent = '';
            } else {
                errorDiv.textContent = 'Invalid password. Please try again.';
                document.getElementById('passwordInput').value = '';
            }
        }

        function logout() {
            isAuthenticated = false;
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('authenticated');
        }

        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isAuthenticated) {
                authenticate();
            }
        });

        class EnhancedDashboard {
            constructor() {
                this.apiUrl = API_BASE;
                this.endpoints = [
                    { name: 'equity', title: 'Portfolio Equity', icon: '💰', endpoint: '/status' },
                    { name: 'signals', title: 'Trading Signals', icon: '🎯', endpoint: '/signals', special: 'signals_table' },
                    { name: 'trades', title: 'Trade History', icon: '📈', endpoint: '/trades/recent' },
                    { name: 'trading_status', title: 'Trading Controls', icon: '🎛️', endpoint: '/trading/status' },
                    { name: 'ml', title: 'ML Performance', icon: '🧠', endpoint: '/ml/status' },
                    { name: 'quantum', title: 'Quantum Analysis', icon: '⚛️', endpoint: '/quantum/analysis' },
                    { name: 'sentiment', title: 'Sentiment Analysis', icon: '📰', endpoint: '/sentiment' },
                    { name: 'positions', title: 'Current Positions', icon: '💼', endpoint: '/positions' },
                    { name: 'health', title: 'System Health', icon: '🔋', endpoint: '/health' },
                    { name: 'logs', title: 'System Logs', icon: '📝', endpoint: '/logs' }
                ];
                this.endpointData = {};
                this.init();
            }

            async init() {
                console.log('🚀 Initializing Enhanced Dashboard...');
                await this.loadAllEndpoints();
                this.renderSlates();
                this.updateTradingStatus();
                
                setInterval(() => {
                    this.loadAllEndpoints();
                    this.updateSlateMetrics();
                    this.updateTradingStatus();
                }, 10000);
            }

            async loadAllEndpoints() {
                const promises = this.endpoints.map(endpoint => this.loadEndpoint(endpoint));
                await Promise.allSettled(promises);
            }

            async loadEndpoint(endpoint) {
                try {
                    const response = await fetch(`${this.apiUrl}${endpoint.endpoint}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    this.endpointData[endpoint.name] = data;
                    console.log(`✅ Loaded ${endpoint.name}:`, typeof data === 'object' ? Object.keys(data) : data);
                } catch (error) {
                    console.log(`❌ Error loading ${endpoint.name}: ${error.message}`);
                    this.endpointData[endpoint.name] = { error: error.message };
                }
            }

            renderSlates() {
                const container = document.getElementById('slates-container');
                container.innerHTML = '';

                this.endpoints.forEach(endpoint => {
                    const slate = document.createElement('div');
                    slate.className = 'slate';
                    slate.onclick = () => this.handleSlateClick(endpoint);
                    
                    slate.innerHTML = `
                        <div class="slate-header">
                            <div class="slate-title">${endpoint.title}</div>
                            <div class="slate-icon">${endpoint.icon}</div>
                        </div>
                        <div class="slate-content" id="slate-${endpoint.name}">
                            Loading...
                        </div>
                    `;
                    
                    container.appendChild(slate);
                });

                this.updateSlateMetrics();
            }

            updateSlateMetrics() {
                this.endpoints.forEach(endpoint => {
                    const element = document.getElementById(`slate-${endpoint.name}`);
                    const data = this.endpointData[endpoint.name];
                    
                    if (!element) return;
                    
                    if (data && !data.error) {
                        element.innerHTML = this.formatSlateContent(endpoint, data);
                    } else {
                        element.innerHTML = `<div style="color: #f44336;">Error: ${data?.error || 'No data'}</div>`;
                    }
                });
            }

            formatSlateContent(endpoint, data) {
                switch (endpoint.name) {
                    case 'equity':
                        const equity = data.equity?.display_value || data.equity || 0;
                        const posCount = data.positions ? Object.keys(data.positions).length : 0;
                        return `
                            <div class="metric">
                                <span>Total Equity:</span>
                                <span style="color: #4caf50; font-weight: 600;">$${equity.toFixed(2)}</span>
                            </div>
                            <div class="metric">
                                <span>Active Positions:</span>
                                <span>${posCount}</span>
                            </div>
                        `;

                    case 'signals':
                        const signals = data.signals || [];
                        const buySignals = signals.filter(s => s.signal === 'BUY').length;
                        const sellSignals = signals.filter(s => s.signal === 'SELL').length;
                        const holdSignals = signals.filter(s => s.signal === 'HOLD').length;
                        return `
                            <div class="metric">
                                <span>🟢 BUY Signals:</span>
                                <span>${buySignals}</span>
                            </div>
                            <div class="metric">
                                <span>🔴 SELL Signals:</span>
                                <span>${sellSignals}</span>
                            </div>
                            <div class="metric">
                                <span>🟡 HOLD Signals:</span>
                                <span>${holdSignals}</span>
                            </div>
                            <div style="margin-top: 1rem; font-size: 0.75rem; color: #64ffda;">
                                Click to view detailed signals table
                            </div>
                        `;

                    case 'trading_status':
                        return `
                            <div class="metric">
                                <span>Trade Enabled:</span>
                                <span style="color: ${data.trade_enabled ? '#4caf50' : '#f44336'}">${data.trade_enabled ? 'Yes' : 'No'}</span>
                            </div>
                            <div class="metric">
                                <span>Execution Enabled:</span>
                                <span style="color: ${data.execution_enabled ? '#4caf50' : '#f44336'}">${data.execution_enabled ? 'Yes' : 'No'}</span>
                            </div>
                            <div class="metric">
                                <span>Recent Trades:</span>
                                <span>${data.recent_trades || 0}</span>
                            </div>
                        `;

                    case 'trades':
                        const trades = data.trades || [];
                        const recentTrades = trades.slice(0, 3);
                        if (recentTrades.length === 0) {
                            return '<div style="color: #ffa726;">No trades executed yet</div>';
                        }
                        return recentTrades.map(trade => `
                            <div class="metric">
                                <span>${trade.symbol}</span>
                                <span style="color: ${trade.side === 'BUY' ? '#4caf50' : '#f44336'}">${trade.side} ${trade.quantity}</span>
                            </div>
                        `).join('');

                    case 'logs':
                        const logs = data.logs || [];
                        const recentLogs = logs.slice(-3);
                        return recentLogs.map(log => `
                            <div style="font-family: monospace; font-size: 0.75rem; margin-bottom: 0.5rem; color: #a0aec0;">
                                ${log.substring(0, 60)}...
                            </div>
                        `).join('');

                    default:
                        return '<div>Click to view details</div>';
                }
            }

            handleSlateClick(endpoint) {
                switch(endpoint.name) {
                    case 'signals':
                        this.showSignalsTable();
                        break;
                    case 'trades':
                        this.showTradesModal();
                        break;
                    case 'positions':
                        this.showPositionsModal();
                        break;
                    case 'sentiment':
                        this.showSentimentModal();
                        break;
                    case 'ml':
                        this.showMLModal();
                        break;
                    case 'logs':
                        this.showLogsModal();
                        break;
                    case 'health':
                        this.showHealthModal();
                        break;
                    default:
                        this.showGenericModal(endpoint);
                        break;
                }
            }

            async showSignalsTable() {
                document.getElementById('signalsModal').style.display = 'block';
                const container = document.getElementById('signalsTableContainer');
                container.innerHTML = '<div class="loading">Loading comprehensive signals analysis...</div>';

                try {
                    // Load signals and positions data
                    const [signalsRes, positionsRes] = await Promise.all([
                        fetch(`${this.apiUrl}/signals`),
                        fetch(`${this.apiUrl}/status`)
                    ]);

                    const signalsData = await signalsRes.json();
                    const statusData = await positionsRes.json();
                    
                    const signals = signalsData.signals || [];
                    const positions = statusData.positions || {};

                    // Create comprehensive signals table
                    let tableHTML = `
                        <table class="signals-table">
                            <thead>
                                <tr>
                                    <th>Symbol</th>
                                    <th>Signal</th>
                                    <th>Confidence</th>
                                    <th>Current Price</th>
                                    <th>Change %</th>
                                    <th>Position</th>
                                    <th>P&L</th>
                                    <th>Arbitrage</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    // Add signals from the signals endpoint
                    signals.forEach(signal => {
                        const position = positions[signal.symbol] || {};
                        const hasPosition = Object.keys(position).length > 0;
                        const pnl = position.pnl || 0;
                        const change = signal.change ? (signal.change * 100).toFixed(2) : 'N/A';
                        const price = signal.price ? signal.price.toFixed(2) : 'N/A';
                        
                        // Determine confidence class
                        const conf = signal.conf || 0;
                        let confClass = 'confidence-low';
                        if (conf > 0.7) confClass = 'confidence-high';
                        else if (conf > 0.5) confClass = 'confidence-medium';
                        
                        // Check for arbitrage opportunity (simplified)
                        const isArbitrage = hasPosition && Math.abs(change) > 2 && conf > 0.6;
                        
                        tableHTML += `
                            <tr>
                                <td><strong>${signal.symbol}</strong></td>
                                <td><span class="signal-${signal.signal.toLowerCase()}">${signal.signal}</span></td>
                                <td><span class="${confClass}">${(conf * 100).toFixed(1)}%</span></td>
                                <td>$${price}</td>
                                <td style="color: ${parseFloat(change) >= 0 ? '#4caf50' : '#f44336'}">${change}%</td>
                                <td>${hasPosition ? '✅' : '❌'}</td>
                                <td style="color: ${pnl >= 0 ? '#4caf50' : '#f44336'}">$${pnl.toFixed(2)}</td>
                                <td>${isArbitrage ? '<span class="arbitrage-opportunity">OPPORTUNITY</span>' : '-'}</td>
                                <td>
                                    ${signal.signal === 'BUY' && conf > 0.6 ? '🟢 Execute Buy' : ''}
                                    ${signal.signal === 'SELL' && conf > 0.6 ? '🔴 Execute Sell' : ''}
                                    ${signal.signal === 'HOLD' || conf <= 0.6 ? '🟡 Hold' : ''}
                                </td>
                            </tr>
                        `;
                    });

                    // Add potential arbitrage pairs (cross-pair opportunities)
                    const positionSymbols = Object.keys(positions);
                    for (let i = 0; i < positionSymbols.length; i++) {
                        for (let j = i + 1; j < positionSymbols.length; j++) {
                            const symbol1 = positionSymbols[i];
                            const symbol2 = positionSymbols[j];
                            const pos1 = positions[symbol1];
                            const pos2 = positions[symbol2];
                            
                            // Simple arbitrage detection
                            const pnl1_pct = pos1.pnl_percentage || 0;
                            const pnl2_pct = pos2.pnl_percentage || 0;
                            const spread = Math.abs(pnl1_pct - pnl2_pct);
                            
                            if (spread > 3) { // >3% spread indicates potential arbitrage
                                const crossPair = `${symbol1.split('/')[0]}/${symbol2.split('/')[0]}`;
                                tableHTML += `
                                    <tr style="background: rgba(156, 39, 176, 0.1);">
                                        <td><strong>${crossPair}</strong></td>
                                        <td><span class="arbitrage-opportunity">ARBITRAGE</span></td>
                                        <td class="confidence-high">${Math.min(95, 60 + spread).toFixed(1)}%</td>
                                        <td>Cross-pair</td>
                                        <td style="color: #9c27b0">${spread.toFixed(2)}% spread</td>
                                        <td>✅ Both</td>
                                        <td style="color: #9c27b0">Potential</td>
                                        <td><span class="arbitrage-opportunity">ATOMIC SWAP</span></td>
                                        <td>🔄 Cross-trade</td>
                                    </tr>
                                `;
                            }
                        }
                    }

                    tableHTML += '</tbody></table>';
                    
                    // Add summary stats
                    const totalSignals = signals.length;
                    const highConfSignals = signals.filter(s => s.conf > 0.6).length;
                    const arbitrageOpps = positionSymbols.length > 1 ? Math.floor(positionSymbols.length * (positionSymbols.length - 1) / 2) : 0;
                    
                    const summaryHTML = `
                        <div style="margin-bottom: 2rem; padding: 1rem; background: rgba(100, 255, 218, 0.1); border-radius: 8px;">
                            <h3 style="color: #64ffda; margin-bottom: 1rem;">📊 Signals Summary</h3>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                                <div>
                                    <strong>Total Signals:</strong> ${totalSignals}<br>
                                    <strong>High Confidence (>60%):</strong> ${highConfSignals}<br>
                                    <strong>Potential Arbitrage Pairs:</strong> ${arbitrageOpps}
                                </div>
                                <div>
                                    <strong>Top 50 Crypto Analysis:</strong> Active<br>
                                    <strong>Atomic Swap Detection:</strong> Enabled<br>
                                    <strong>Real-time Updates:</strong> Every 30s
                                </div>
                            </div>
                        </div>
                    `;

                    container.innerHTML = summaryHTML + tableHTML;
                } catch (error) {
                    container.innerHTML = `<div style="color: #f44336;">Error loading signals: ${error.message}</div>`;
                }
            }

            async updateTradingStatus() {
                try {
                    const response = await fetch(`${this.apiUrl}/trading/status`);
                    const data = await response.json();
                    
                    const statusElement = document.getElementById('tradingStatus');
                    const statusText = document.getElementById('statusText');
                    
                    if (data.execution_enabled) {
                        statusElement.className = 'trading-status trading-enabled';
                        statusText.textContent = '🟢 Trading Active';
                    } else {
                        statusElement.className = 'trading-status trading-disabled';
                        statusText.textContent = '🔴 Trading Stopped';
                    }
                } catch (error) {
                    const statusText = document.getElementById('statusText');
                    statusText.textContent = '⚠️ Status Unknown';
                }
            }
        }

        // Trading Controls
        async function startTrading() {
            try {
                const response = await fetch(`${API_BASE}/trading/start`, { 
                    method: 'POST',
                    headers: { 'X-Dashboard-Password': DASHBOARD_PASSWORD }
                });
                const data = await response.json();
                alert(data.ok ? '✅ Trading started!' : '❌ Failed to start trading');
                dashboard.updateTradingStatus();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function stopTrading() {
            if (confirm('⚠️ Stop trading execution?')) {
                try {
                    const response = await fetch(`${API_BASE}/trading/stop`, { 
                        method: 'POST',
                        headers: { 'X-Dashboard-Password': DASHBOARD_PASSWORD }
                    });
                    const data = await response.json();
                    alert(data.ok ? '🛑 Trading stopped!' : '❌ Failed to stop trading');
                    dashboard.updateTradingStatus();
                } catch (error) {
                    alert('❌ Error: ' + error.message);
                }
            }

            // Additional Modal Functions
            async showTradesModal() {
                this.showDataModal('Trades History', '/trades/recent', (data) => {
                    const trades = data.trades || [];
                    if (trades.length === 0) {
                        return '<div style="text-align: center; color: #ffa726; padding: 2rem;">No trades executed yet</div>';
                    }
                    
                    let tableHTML = `
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Symbol</th>
                                    <th>Side</th>
                                    <th>Quantity</th>
                                    <th>Price</th>
                                    <th>P&L</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    trades.forEach(trade => {
                        const pnlColor = trade.pnl > 0 ? '#4caf50' : (trade.pnl < 0 ? '#f44336' : '#ffa726');
                        const sideColor = trade.side === 'BUY' ? '#4caf50' : '#f44336';
                        
                        tableHTML += `
                            <tr>
                                <td>${new Date(trade.timestamp).toLocaleString()}</td>
                                <td><strong>${trade.symbol}</strong></td>
                                <td><span style="color: ${sideColor}; font-weight: bold;">${trade.side}</span></td>
                                <td>${trade.quantity}</td>
                                <td>$${trade.price ? trade.price.toFixed(4) : 'N/A'}</td>
                                <td style="color: ${pnlColor}; font-weight: bold;">${trade.pnl ? '$' + trade.pnl.toFixed(2) : 'N/A'}</td>
                                <td><span class="status-${trade.status?.toLowerCase() || 'pending'}">${trade.status || 'Pending'}</span></td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += '</tbody></table>';
                    return tableHTML;
                });
            }

            async showPositionsModal() {
                this.showDataModal('Current Positions', '/positions', (data) => {
                    const positions = data.positions || {};
                    const positionList = Object.entries(positions);
                    
                    if (positionList.length === 0) {
                        return '<div style="text-align: center; color: #ffa726; padding: 2rem;">No open positions</div>';
                    }
                    
                    let tableHTML = `
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Symbol</th>
                                    <th>Quantity</th>
                                    <th>Entry Price</th>
                                    <th>Current Price</th>
                                    <th>Unrealized P&L</th>
                                    <th>% Change</th>
                                    <th>Value</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    positionList.forEach(([symbol, position]) => {
                        const pnl = position.unrealized_pnl || 0;
                        const pnlColor = pnl > 0 ? '#4caf50' : (pnl < 0 ? '#f44336' : '#ffa726');
                        const changePercent = position.change_percent || 0;
                        const changeColor = changePercent > 0 ? '#4caf50' : (changePercent < 0 ? '#f44336' : '#ffa726');
                        
                        tableHTML += `
                            <tr>
                                <td><strong>${symbol}</strong></td>
                                <td>${position.quantity || 0}</td>
                                <td>$${position.entry_price ? position.entry_price.toFixed(4) : 'N/A'}</td>
                                <td>$${position.current_price ? position.current_price.toFixed(4) : 'N/A'}</td>
                                <td style="color: ${pnlColor}; font-weight: bold;">$${pnl.toFixed(2)}</td>
                                <td style="color: ${changeColor}; font-weight: bold;">${changePercent.toFixed(2)}%</td>
                                <td>$${position.market_value ? position.market_value.toFixed(2) : 'N/A'}</td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += '</tbody></table>';
                    return tableHTML;
                });
            }

            async showSentimentModal() {
                this.showDataModal('Sentiment Analysis', '/sentiment', (data) => {
                    const sentiment = data.sentiment || {};
                    
                    let contentHTML = `
                        <div class="sentiment-overview">
                            <div class="sentiment-metric">
                                <span>Overall Sentiment:</span>
                                <span style="color: ${sentiment.overall === 'positive' ? '#4caf50' : sentiment.overall === 'negative' ? '#f44336' : '#ffa726'}">
                                    ${sentiment.overall ? sentiment.overall.toUpperCase() : 'NEUTRAL'}
                                </span>
                            </div>
                            <div class="sentiment-metric">
                                <span>Confidence Score:</span>
                                <span>${sentiment.confidence ? (sentiment.confidence * 100).toFixed(1) + '%' : 'N/A'}</span>
                            </div>
                        </div>
                    `;
                    
                    if (sentiment.symbols) {
                        contentHTML += `
                            <table class="data-table" style="margin-top: 1rem;">
                                <thead>
                                    <tr>
                                        <th>Symbol</th>
                                        <th>Sentiment</th>
                                        <th>Score</th>
                                        <th>News Count</th>
                                        <th>Social Mentions</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                        
                        Object.entries(sentiment.symbols).forEach(([symbol, data]) => {
                            const sentimentColor = data.sentiment === 'positive' ? '#4caf50' : 
                                                 data.sentiment === 'negative' ? '#f44336' : '#ffa726';
                            
                            contentHTML += `
                                <tr>
                                    <td><strong>${symbol}</strong></td>
                                    <td style="color: ${sentimentColor}; font-weight: bold;">${data.sentiment?.toUpperCase() || 'NEUTRAL'}</td>
                                    <td>${data.score ? data.score.toFixed(2) : 'N/A'}</td>
                                    <td>${data.news_count || 0}</td>
                                    <td>${data.social_mentions || 0}</td>
                                </tr>
                            `;
                        });
                        
                        contentHTML += '</tbody></table>';
                    }
                    
                    return contentHTML;
                });
            }

            async showMLModal() {
                this.showDataModal('ML Performance', '/ml/status', (data) => {
                    const ml = data.ml || {};
                    
                    let contentHTML = `
                        <div class="ml-overview">
                            <div class="ml-metric">
                                <span>Model Accuracy:</span>
                                <span style="color: #4caf50; font-weight: bold;">${ml.accuracy ? (ml.accuracy * 100).toFixed(1) + '%' : 'N/A'}</span>
                            </div>
                            <div class="ml-metric">
                                <span>Predictions Made:</span>
                                <span>${ml.predictions_count || 0}</span>
                            </div>
                            <div class="ml-metric">
                                <span>Training Status:</span>
                                <span style="color: ${ml.training_status === 'active' ? '#4caf50' : '#ffa726'}">${ml.training_status || 'Unknown'}</span>
                            </div>
                        </div>
                    `;
                    
                    if (ml.recent_predictions) {
                        contentHTML += `
                            <table class="data-table" style="margin-top: 1rem;">
                                <thead>
                                    <tr>
                                        <th>Symbol</th>
                                        <th>Prediction</th>
                                        <th>Confidence</th>
                                        <th>Target Price</th>
                                        <th>Time Horizon</th>
                                        <th>Actual Result</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                        
                        ml.recent_predictions.forEach(pred => {
                            const confColor = pred.confidence > 0.8 ? '#4caf50' : pred.confidence > 0.6 ? '#ffa726' : '#f44336';
                            const predColor = pred.prediction === 'UP' ? '#4caf50' : '#f44336';
                            
                            contentHTML += `
                                <tr>
                                    <td><strong>${pred.symbol}</strong></td>
                                    <td style="color: ${predColor}; font-weight: bold;">${pred.prediction}</td>
                                    <td style="color: ${confColor}">${(pred.confidence * 100).toFixed(1)}%</td>
                                    <td>$${pred.target_price ? pred.target_price.toFixed(4) : 'N/A'}</td>
                                    <td>${pred.time_horizon || 'N/A'}</td>
                                    <td style="color: ${pred.actual_result === 'correct' ? '#4caf50' : pred.actual_result === 'incorrect' ? '#f44336' : '#ffa726'}">
                                        ${pred.actual_result || 'Pending'}
                                    </td>
                                </tr>
                            `;
                        });
                        
                        contentHTML += '</tbody></table>';
                    }
                    
                    return contentHTML;
                });
            }

            async showLogsModal() {
                this.showDataModal('System Logs', '/logs', (data) => {
                    const logs = data.logs || [];
                    
                    if (logs.length === 0) {
                        return '<div style="text-align: center; color: #ffa726; padding: 2rem;">No logs available</div>';
                    }
                    
                    let contentHTML = '<div class="logs-container">';
                    logs.slice(-20).forEach(log => {
                        const logClass = log.includes('ERROR') ? 'log-error' : 
                                       log.includes('WARNING') ? 'log-warning' : 
                                       log.includes('SUCCESS') ? 'log-success' : 'log-info';
                        
                        contentHTML += `<div class="log-entry ${logClass}">${log}</div>`;
                    });
                    contentHTML += '</div>';
                    
                    return contentHTML;
                });
            }

            async showHealthModal() {
                this.showDataModal('System Health', '/health', (data) => {
                    let contentHTML = `
                        <div class="health-overview">
                            <div class="health-metric">
                                <span>API Status:</span>
                                <span style="color: ${data.status === 'healthy' ? '#4caf50' : '#f44336'}">
                                    ${data.status ? data.status.toUpperCase() : 'UNKNOWN'}
                                </span>
                            </div>
                            <div class="health-metric">
                                <span>Exchange Connection:</span>
                                <span style="color: ${data.exchange_status === 'connected' ? '#4caf50' : '#f44336'}">
                                    ${data.exchange_status ? data.exchange_status.toUpperCase() : 'UNKNOWN'}
                                </span>
                            </div>
                            <div class="health-metric">
                                <span>Current Equity:</span>
                                <span style="color: #4caf50; font-weight: bold;">$${data.equity ? data.equity.toFixed(2) : '0.00'}</span>
                            </div>
                            <div class="health-metric">
                                <span>Uptime:</span>
                                <span>${data.uptime || 'N/A'}</span>
                            </div>
                            <div class="health-metric">
                                <span>Last Updated:</span>
                                <span>${new Date().toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                    
                    return contentHTML;
                });
            }

            async showGenericModal(endpoint) {
                this.showDataModal(endpoint.title, endpoint.endpoint, (data) => {
                    return `<pre style="background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; overflow: auto; max-height: 400px;">${JSON.stringify(data, null, 2)}</pre>`;
                });
            }

            async showDataModal(title, endpoint, formatter) {
                // Create or update modal
                let modal = document.getElementById('dataModal');
                if (!modal) {
                    modal = document.createElement('div');
                    modal.id = 'dataModal';
                    modal.className = 'signals-modal';
                    modal.innerHTML = `
                        <div class="signals-content">
                            <div class="signals-header">
                                <h2 class="signals-title" id="modalTitle">${title}</h2>
                                <button onclick="closeDataModal()" class="close-btn">✕</button>
                            </div>
                            <div id="modalContent" class="loading">Loading...</div>
                        </div>
                    `;
                    document.body.appendChild(modal);
                }
                
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalContent').innerHTML = '<div class="loading">Loading...</div>';
                modal.style.display = 'block';
                
                try {
                    const response = await fetch(`${this.apiUrl}${endpoint}`);
                    const data = await response.json();
                    document.getElementById('modalContent').innerHTML = formatter(data);
                } catch (error) {
                    document.getElementById('modalContent').innerHTML = `
                        <div style="text-align: center; color: #f44336; padding: 2rem;">
                            <div>❌ Error loading data</div>
                            <div style="font-size: 0.875rem; margin-top: 0.5rem;">${error.message}</div>
                        </div>
                    `;
                }
            }
        }

        function closeSignalsModal() {
            document.getElementById('signalsModal').style.display = 'none';
        }

        function closeDataModal() {
            const modal = document.getElementById('dataModal');
            if (modal) modal.style.display = 'none';
        }

        // Initialize
        let dashboard;
        function initDashboard() {
            dashboard = new EnhancedDashboard();
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('passwordInput').focus();
        });

        // Close modal when clicking outside
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('signalsModal');
            if (modal && e.target === modal) {
                closeSignalsModal();
            }
        });
    </script>
</body>
</html>
