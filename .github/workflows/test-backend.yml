name: test-backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Qiskit
        run: |
          pip install qiskit

      - name: Verify IBMQ Access
        run: python scripts/verify_ibmq.py
        env:
          IBMQ_API_KEY: ${{ secrets.IBMQ_API_KEY }}
