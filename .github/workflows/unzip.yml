name: Unzip Bot Package

on:
  push:
    branches:
      - main

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Extract ZIP and merge files
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -f "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
            # Merge extracted files into repo without deleting existing files
            rsync -av extracted/* ./
            rm -rf extracted "$ZIP_FILE"
          else
            echo "No ZIP file found in repo"
          fi

      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Merged bot files from ZIP" || echo "No changes to commit"
          git push origin main
