name: Unzip Bot Package

on:
  push:
    branches:
      - main

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Extract ZIP and merge files
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -f "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
            if [ -d "extracted/trading_bot_final_complete" ]; then
              rsync -av extracted/trading_bot_final_complete/ ./ --ignore-existing
            else
              rsync -av extracted/ ./ --ignore-existing
            fi
            rm -rf extracted "$ZIP_FILE"
          else
            echo "No ZIP file found"
          fi

      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: $