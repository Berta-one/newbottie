<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bottie — Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🧠</span>
      <h1>Bottie</h1>
      <small>Live Status</small>
    </div>

    <div class="api-config">
      <label for="apiBase">API Base</label>
      <input id="apiBase" type="url" placeholder="https://bottie-api.onrender.com" />
      <button id="saveApi">Save</button>
    </div>
  </header>

  <main class="container">
    <section class="grid">
      <div class="card">
        <h2>Health</h2>
        <div class="kv">
          <div><span>Status:</span><b id="health-status">—</b></div>
          <div><span>Time:</span><b id="health-time">—</b></div>
          <div><span>Quantum:</span><b id="health-quantum">—</b></div>
        </div>
      </div>

      <div class="card">
        <h2>Equity</h2>
        <div class="big" id="equity">—</div>
        <canvas id="equityChart" height="120"></canvas>
      </div>

      <div class="card">
        <h2>Positions</h2>
        <table class="table" id="positionsTable">
          <thead><tr><th>Symbol</th><th>Qty</th><th>Avg Px</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Recent Signals</h2>
        <table class="table" id="signalsTable">
          <thead><tr><th>Time</th><th>Symbol</th><th>Signal</th><th>Conf.</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card logs">
        <h2>Logs</h2>
        <pre id="logsView">—</pre>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>Powered by Bottie • <a href="https://render.com" target="_blank">Render</a> + <a href="https://www.netlify.com/" target="_blank">Netlify</a></span>
  </footer>
</body>
</html>
