[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://bottie-1.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mobile"
  to = "/mobile.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"