<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Test</title>
    <style>
        body { background: #0b0f12; color: #e9f1f5; font-family: Arial, sans-serif; padding: 20px; }
        .test-section { background: #12171c; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: rgba(76,175,80,0.2); color: #4caf50; }
        .error { background: rgba(244,67,54,0.2); color: #f44336; }
        .pending { background: rgba(255,152,0,0.2); color: #ff9800; }
    </style>
</head>
<body>
    <h1>🧪 Bottie Grid Integration Test</h1>
    
    <div class="test-section">
        <h2>Backend API Tests</h2>
        <div id="api-status" class="status pending">Testing API connection...</div>
        <div id="grid-status" class="status pending">Testing grid endpoints...</div>
        <div id="data-status" class="status pending">Testing data structure...</div>
    </div>

    <div class="test-section">
        <h2>Frontend Integration Tests</h2>
        <div id="dom-status" class="status pending">Testing DOM elements...</div>
        <div id="render-status" class="status pending">Testing grid rendering...</div>
    </div>

    <div class="test-section">
        <h2>Sample Grid Preview</h2>
        <div id="sample-grid"></div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000"; // Adjust as needed
        
        async function testAPI() {
            const status = document.getElementById('api-status');
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    status.textContent = "✅ API connection successful";
                    status.className = "status success";
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (e) {
                status.textContent = `❌ API connection failed: ${e.message}`;
                status.className = "status error";
                return false;
            }
        }

        async function testGridEndpoints() {
            const status = document.getElementById('grid-status');
            try {
                const endpoints = ['/grid/matrix', '/portfolio/assets', '/scan/assets'];
                const results = await Promise.all(
                    endpoints.map(ep => fetch(`${API_BASE}${ep}`).then(r => r.json()))
                );
                
                status.textContent = `✅ Grid endpoints working: ${endpoints.join(', ')}`;
                status.className = "status success";
                return results[0]; // Return matrix data
            } catch (e) {
                status.textContent = `❌ Grid endpoints failed: ${e.message}`;
                status.className = "status error";
                return null;
            }
        }

        function testDataStructure(data) {
            const status = document.getElementById('data-status');
            if (!data) {
                status.textContent = "❌ No data to test";
                status.className = "status error";
                return false;
            }

            const hasRows = Array.isArray(data.rows) && data.rows.length > 0;
            const hasCols = Array.isArray(data.cols) && data.cols.length > 0;
            const hasMatrix = data.matrix && typeof data.matrix === 'object';

            if (hasRows && hasCols && hasMatrix) {
                status.textContent = `✅ Data structure valid: ${data.rows.length} rows, ${data.cols.length} cols`;
                status.className = "status success";
                return true;
            } else {
                status.textContent = `❌ Invalid data structure - rows:${hasRows}, cols:${hasCols}, matrix:${hasMatrix}`;
                status.className = "status error";
                return false;
            }
        }

        function testDOM() {
            const status = document.getElementById('dom-status');
            const elements = ['maxi-grid', 'maxi-grid-thead', 'maxi-grid-tbody', 'grid-last-ts'];
            const missing = elements.filter(id => !document.getElementById(id));
            
            if (missing.length === 0) {
                status.textContent = "✅ All required DOM elements found";
                status.className = "status success";
                return true;
            } else {
                status.textContent = `❌ Missing DOM elements: ${missing.join(', ')}`;
                status.className = "status error";
                return false;
            }
        }

        function createSampleGrid(data) {
            const container = document.getElementById('sample-grid');
            if (!data || !data.rows || !data.cols) {
                container.innerHTML = '<p style="color:#ff9800;">No data available for sample grid</p>';
                return;
            }

            const maxRows = Math.min(data.rows.length, 5);
            const maxCols = Math.min(data.cols.length, 8);
            
            let html = '<table style="border-collapse: collapse; width: 100%; font-size: 12px;">';
            html += '<tr><th style="padding:8px;border:1px solid #333;background:#1a1a1a;"></th>';
            
            for (let c = 0; c < maxCols; c++) {
                html += `<th style="padding:8px;border:1px solid #333;background:#1a1a1a;">${data.cols[c]}</th>`;
            }
            html += '</tr>';

            for (let r = 0; r < maxRows; r++) {
                html += `<tr><th style="padding:8px;border:1px solid #333;background:#1a1a1a;">${data.rows[r]}</th>`;
                
                for (let c = 0; c < maxCols; c++) {
                    const base = data.rows[r];
                    const quote = data.cols[c];
                    const cellData = data.matrix[base] && data.matrix[base][quote];
                    
                    let cellContent = 'NA';
                    let cellStyle = 'color:#999;';
                    
                    if (cellData && cellData.signal) {
                        cellContent = cellData.signal;
                        if (cellData.signal === 'BUY') cellStyle = 'color:#4caf50;background:rgba(76,175,80,0.1);';
                        else if (cellData.signal === 'SELL') cellStyle = 'color:#f44336;background:rgba(244,67,54,0.1);';
                        else if (cellData.signal === 'HOLD') cellStyle = 'color:#ff9800;background:rgba(255,152,0,0.1);';
                    }
                    
                    html += `<td style="padding:8px;border:1px solid #333;text-align:center;${cellStyle}">${cellContent}</td>`;
                }
                html += '</tr>';
            }
            html += '</table>';
            
            container.innerHTML = html;
        }

        // Run tests
        async function runTests() {
            console.log('🧪 Starting Bottie Grid Integration Tests...');
            
            const apiOK = await testAPI();
            if (!apiOK) return;
            
            const gridData = await testGridEndpoints();
            const dataOK = testDataStructure(gridData);
            
            // DOM test (these elements won't exist in this test page)
            const domStatus = document.getElementById('dom-status');
            domStatus.textContent = "⚠️ DOM test skipped (elements not in test page)";
            domStatus.className = "status pending";
            
            const renderStatus = document.getElementById('render-status');
            if (dataOK && gridData) {
                createSampleGrid(gridData);
                renderStatus.textContent = "✅ Sample grid rendered successfully";
                renderStatus.className = "status success";
            } else {
                renderStatus.textContent = "❌ Cannot render without valid data";
                renderStatus.className = "status error";
            }
            
            console.log('🎉 Tests complete!');
        }

        // Start tests when page loads
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
