<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 API Debug Test</h1>
        <p><strong>Deployment Time:</strong> <span id="deployTime"></span></p>
        <p><strong>Current URL:</strong> <span id="currentUrl"></span></p>
        
        <button onclick="testRelativeAPI()">Test Relative API (/api)</button>
        <button onclick="testDirectAPI()">Test Direct API (render.com)</button>
        <button onclick="testBothAPIs()">Test Both</button>
        <button onclick="clearResults()">Clear Results</button>
        
        <div id="results"></div>
    </div>

    <script>
        // Set deployment info
        document.getElementById('deployTime').textContent = new Date().toISOString();
        document.getElementById('currentUrl').textContent = window.location.href;
        
        async function testRelativeAPI() {
            addResult('info', 'Testing relative API: /api/trades');
            try {
                const response = await fetch('/api/trades');
                const data = await response.json();
                addResult('success', `✅ Relative API Success (${response.status})`);
                addResult('info', `Response: <pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                addResult('error', `❌ Relative API Error: ${error.message}`);
            }
        }
        
        async function testDirectAPI() {
            addResult('info', 'Testing direct API: https://bottie-1.onrender.com/api/trades');
            try {
                const response = await fetch('https://bottie-1.onrender.com/api/trades');
                const data = await response.json();
                addResult('success', `✅ Direct API Success (${response.status})`);
                addResult('info', `Response: <pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                addResult('error', `❌ Direct API Error: ${error.message}`);
            }
        }
        
        async function testBothAPIs() {
            clearResults();
            await testRelativeAPI();
            await new Promise(resolve => setTimeout(resolve, 1000));
            await testDirectAPI();
        }
        
        function addResult(type, message) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            addResult('info', '🚀 Debug page loaded successfully');
            addResult('info', 'Click buttons above to test API endpoints');
        });
    </script>
</body>
</html>
