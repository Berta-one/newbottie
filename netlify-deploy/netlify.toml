[build]
  publish = "."
  command = "echo 'Static site - no build required'"

[[redirects]]
  from = "/api/*"
  to = "https://bottie-1.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/reports"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/dashboard.html"
  status = 200
