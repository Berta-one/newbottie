<!DOCTYPE html>
<html>
<head>
    <title>WORKING API TEST - NETLIFY DEPLOY FOLDER</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: rgba(255,255,255,0.1); 
            padding: 30px; 
            border-radius: 15px; 
            backdrop-filter: blur(10px);
        }
        .result { padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; }
        .success { background: rgba(40, 167, 69, 0.9); }
        .error { background: rgba(220, 53, 69, 0.9); }
        .info { background: rgba(23, 162, 184, 0.9); }
        .warning { background: rgba(255, 193, 7, 0.9); color: #212529; }
        button { 
            background: #28a745; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            margin: 10px 5px;
        }
        .version-banner {
            background: rgba(40, 167, 69, 0.9);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="version-banner">
            🎯 NETLIFY-DEPLOY FOLDER FIX - v2024-08-19-NETLIFY-DEPLOY
            <br>
            <small>Finally deployed to the correct directory!</small>
        </div>
        
        <h1>🚀 API Test - Correct Deploy Folder</h1>
        <p><strong>Deploy Time:</strong> <span id="deployTime"></span></p>
        <p><strong>Folder:</strong> netlify-deploy/ (correct!)</p>
        
        <button onclick="testAPI()">🧪 Test API Endpoints</button>
        <button onclick="clearResults()">🗑️ Clear Results</button>
        
        <div id="results"></div>
    </div>

    <script>
        document.getElementById('deployTime').textContent = new Date().toISOString();
        
        console.log('🎯 NETLIFY-DEPLOY FOLDER API TEST LOADED');
        console.log('Version: v2024-08-19-NETLIFY-DEPLOY');
        console.log('Finally in the correct deployment directory!');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
            document.getElementById('results').appendChild(div);
            console.log(message);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testAPI() {
            clearResults();
            addResult('🚀 Testing API from correct deploy folder...', 'info');
            
            const tests = [
                { url: '/api/trades', name: 'Proxy Trades (/api/trades → backend /trades)' },
                { url: '/api/ml/status', name: 'Proxy ML (/api/ml/status → backend /ml/status)' },
                { url: '/api/health', name: 'Proxy Health (/api/health → backend /health)' },
                { url: 'https://bottie-1.onrender.com/trades', name: 'Direct Trades (bypass proxy)' },
                { url: 'https://bottie-1.onrender.com/ml/status', name: 'Direct ML (bypass proxy)' }
            ];
            
            let workingCount = 0;
            
            for (const test of tests) {
                try {
                    addResult(`🔍 Testing ${test.name}...`, 'info');
                    
                    const response = await fetch(test.url, {
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        addResult(`✅ ${test.name} SUCCESS (${response.status})`, 'success');
                        workingCount++;
                        
                        if (test.url.includes('trades') && data.trades) {
                            addResult(`📈 Found ${data.trades.length} trades, P&L: $${(data.summary?.net_pnl || 0).toFixed(2)}`, 'success');
                        }
                        if (test.url.includes('ml') && data.accuracy) {
                            addResult(`🧠 ML Accuracy: ${(data.accuracy * 100).toFixed(1)}%, Predictions: ${data.total_predictions || 0}`, 'success');
                        }
                    } else {
                        addResult(`❌ ${test.name} FAILED (${response.status})`, 'error');
                    }
                } catch (error) {
                    addResult(`💥 ${test.name} ERROR: ${error.message}`, 'error');
                }
                
                await new Promise(resolve => setTimeout(resolve, 300));
            }
            
            addResult(`📊 FINAL RESULT: ${workingCount}/${tests.length} endpoints working`, workingCount > 0 ? 'success' : 'error');
            
            if (workingCount > 0) {
                addResult('🎉 SUCCESS! API endpoints are working. The proxy fix is successful!', 'success');
                addResult('💡 Your reports dashboard should now work without 404 or CORS errors.', 'info');
            } else {
                addResult('⚠️ No endpoints working. Check Render service status.', 'error');
            }
        }
        
        // Auto-run test
        window.onload = function() {
            addResult('🌟 Correct deploy folder API test loaded', 'success');
            setTimeout(() => {
                addResult('🔄 Auto-starting comprehensive API test...', 'info');
                testAPI();
            }, 2000);
        };
    </script>
</body>
</html>
