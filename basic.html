<!DOCTYPE html>
<html>
<head><title>Bottie Trading</title></head>
<body style="font-family:monospace;background:#000;color:#0f0;padding:20px;">
    <h1>🚀 BOTTIE TRADING</h1>
    
    <div>
        <button onclick="start()" style="background:#060;color:#fff;padding:10px;margin:5px;">START</button>
        <button onclick="stop()" style="background:#600;color:#fff;padding:10px;margin:5px;">STOP</button>
        <button onclick="refresh()" style="background:#333;color:#0f0;padding:10px;margin:5px;">REFRESH</button>
    </div>
    
    <div id="data" style="margin-top:20px;white-space:pre-wrap;"></div>
    
    <script>
        const API = 'https://bottie-1.onrender.com';
        
        async function start() {
            try {
                const r = await fetch(API + '/trading/start', {method:'POST', body:'{}'});
                const d = await r.json();
                alert(d.ok ? 'Started' : 'Failed');
            } catch(e) { alert('Error: ' + e.message); }
        }
        
        async function stop() {
            try {
                const r = await fetch(API + '/trading/stop', {method:'POST', body:'{}'});
                const d = await r.json();
                alert(d.ok ? 'Stopped' : 'Failed');
            } catch(e) { alert('Error: ' + e.message); }
        }
        
        async function refresh() {
            try {
                const [signals, ml, sentiment] = await Promise.all([
                    fetch(API + '/signals').then(r => r.json()),
                    fetch(API + '/ml/status').then(r => r.json()),
                    fetch(API + '/sentiment').then(r => r.json())
                ]);
                
                let output = 'SIGNALS:\n';
                signals.signals.forEach(s => {
                    output += `${s.symbol}: ${s.signal} (${(s.conf*100).toFixed(0)}%) @ $${s.price.toLocaleString()}\n`;
                });
                
                output += '\nML:\n';
                output += `Accuracy: ${(ml.accuracy*100).toFixed(1)}%\n`;
                output += `Predictions: ${ml.predictions_count}\n`;
                
                output += '\nSENTIMENT:\n';
                Object.entries(sentiment.symbols).forEach(([sym, data]) => {
                    output += `${sym}: ${data.sentiment.toUpperCase()} (${data.score})\n`;
                });
                
                document.getElementById('data').textContent = output;
            } catch(e) {
                document.getElementById('data').textContent = 'Error: ' + e.message;
            }
        }
        
        refresh();
        setInterval(refresh, 30000);
    </script>
</body>
</html>
