<!DOCTYPE html>
<html>
<head>
    <title>EMERGENCY API TEST</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🚨 EMERGENCY API TEST</h1>
    <p><strong>Timestamp:</strong> <span id="timestamp"></span></p>
    <p><strong>URL:</strong> <span id="currentUrl"></span></p>
    
    <button onclick="testAPI()">Test API Now</button>
    <button onclick="clearResults()">Clear</button>
    
    <div id="results"></div>

    <script>
        document.getElementById('timestamp').textContent = new Date().toISOString();
        document.getElementById('currentUrl').textContent = window.location.href;
        
        console.log('🚨 EMERGENCY API TEST LOADED');
        console.log('Time:', new Date().toISOString());
        console.log('URL:', window.location.href);
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
            document.getElementById('results').appendChild(div);
            console.log(message);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testAPI() {
            clearResults();
            addResult('🚀 Starting emergency API test...', 'info');
            
            const tests = [
                { url: '/api/trades', name: 'Proxy Trades' },
                { url: 'https://bottie-1.onrender.com/trades', name: 'Direct Trades' },
                { url: '/api/ml/status', name: 'Proxy ML' },
                { url: 'https://bottie-1.onrender.com/ml/status', name: 'Direct ML' }
            ];
            
            for (const test of tests) {
                try {
                    addResult(`🔍 Testing ${test.name}: ${test.url}`, 'info');
                    
                    const response = await fetch(test.url);
                    
                    if (response.ok) {
                        const data = await response.json();
                        addResult(`✅ ${test.name} SUCCESS (${response.status})`, 'success');
                        
                        if (test.url.includes('trades') && data.trades) {
                            addResult(`📈 Found ${data.trades.length} trades`, 'success');
                        }
                        if (test.url.includes('ml') && data.accuracy) {
                            addResult(`🧠 Accuracy: ${(data.accuracy * 100).toFixed(1)}%`, 'success');
                        }
                    } else {
                        addResult(`❌ ${test.name} FAILED (${response.status})`, 'error');
                    }
                } catch (error) {
                    addResult(`💥 ${test.name} ERROR: ${error.message}`, 'error');
                }
            }
            
            addResult('✅ Test completed!', 'info');
        }
        
        // Auto-run test
        window.onload = function() {
            setTimeout(testAPI, 1000);
        };
    </script>
</body>
</html>
