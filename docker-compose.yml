# Configuration and code provided inside ZIP

# docker-compose.yml

version: '3.9'

services:
  bottie:
    build: .
    ports:
      - "8501:8501"
    environment:
      - DASHBOARD_PORT=8501
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
    volumes:
      - .:/app
